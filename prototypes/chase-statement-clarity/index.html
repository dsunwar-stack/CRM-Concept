<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chase Statement Clarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: page toolbar (stepper + view switch) over a stage that shows the customer phone, the agent console, or both side by side.
   Customer app: Chase UK-style visual language (approximation, swap in real tokens). Agent console: SLDS 2 (Cosmos) styling-hook names, approximated values. */
:root{
  /* page chrome */
  --page:#E6E9EF; --page-ink:#18202E; --page-muted:#5A6476; --page-line:#D0D6E0; --page-card:#FFFFFF; --page-accent:#005EB8;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  /* customer app — Chase UK style (approximation) */
  --c-font:"Open Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --c-bg:#F2F4F7; --c-card:#FFFFFF; --c-ink:#121821; --c-ink2:#4A5466; --c-ink3:#7D8798; --c-line:#E3E7ED;
  --c-blue:#005EB8; --c-blue-press:#004A93; --c-blue-deep:#0B2D5B; --c-blue-soft:#E7F0FA;
  --c-amber:#8A5300; --c-amber-bg:#FFF1D6; --c-green:#0A7A4F; --c-green-bg:#E2F4EB; --c-slate:#4F5B6E; --c-slate-bg:#EDF0F4; --c-red:#C4261D;

  /* agent console — SLDS 2 global styling hooks (Cosmos-like values) */
  --slds-g-font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --slds-g-color-brand-base-50:#066AFE; --slds-g-color-brand-base-40:#0250D9; --slds-g-color-brand-base-30:#022AC0;
  --slds-g-color-brand-base-90:#D8E6FE; --slds-g-color-brand-base-95:#EEF4FF;
  --slds-g-color-neutral-base-100:#FFFFFF; --slds-g-color-neutral-base-95:#F3F3F3; --slds-g-color-neutral-base-90:#E5E5E5;
  --slds-g-color-neutral-base-80:#C9C9C9; --slds-g-color-neutral-base-60:#939393; --slds-g-color-neutral-base-50:#747474;
  --slds-g-color-neutral-base-30:#444444; --slds-g-color-neutral-base-10:#181818;
  --slds-g-color-on-surface-1:#5C5C5C; --slds-g-color-on-surface-3:#03234D;
  --slds-g-color-success-base-50:#2E844A; --slds-g-color-success-base-95:#EBF7E6;
  --slds-g-color-warning-base-60:#A96404; --slds-g-color-warning-base-95:#FEF1EE;
  --slds-g-color-error-base-50:#EA001E; --slds-g-color-error-base-40:#BA0517;
  --slds-g-color-accent-ai:#7526E3; --slds-g-color-accent-ai-95:#F4EEFE;
  --slds-g-radius-border-1:.25rem; --slds-g-radius-border-2:.5rem; --slds-g-radius-border-3:.75rem; --slds-g-radius-border-4:1.25rem; --slds-g-radius-border-pill:15rem;
  --slds-g-shadow-1:0 0 2px 0 rgba(24,24,24,.08),0 2px 4px 1px rgba(24,24,24,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#0B111C; --page-ink:#E5EAF3; --page-muted:#97A2B5; --page-line:#222D40; --page-card:#121A28; --page-accent:#7DB3F0; color-scheme:dark }
}
:root[data-theme="dark"]{ --page:#0B111C; --page-ink:#E5EAF3; --page-muted:#97A2B5; --page-line:#222D40; --page-card:#121A28; --page-accent:#7DB3F0; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--page-ink);font-family:var(--c-font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--page-accent);outline-offset:2px}
[hidden]{display:none!important}

/* ================= page toolbar ================= */
.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--page-line);background:var(--page-card)}
.tb-title{font-weight:700;font-size:15px;line-height:1.2}
.tb-title span{display:block;font-weight:500;font-size:12px;color:var(--page-muted)}
.stepper{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.stepper button{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;color:var(--page-muted)}
.stepper button i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--page-line);font-size:11px}
.stepper button:hover{color:var(--page-ink)}
.stepper button[aria-current="step"]{color:var(--page-ink);background:var(--page)}
.stepper button[aria-current="step"] i{background:var(--page-accent);border-color:var(--page-accent);color:var(--page-card)}
.seg{display:flex;padding:3px;border-radius:10px;background:var(--page);border:1px solid var(--page-line)}
.seg button{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:7px;color:var(--page-muted);position:relative}
.seg button[aria-pressed="true"]{background:var(--page-card);color:var(--page-ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg .dot{position:absolute;top:3px;right:4px;width:8px;height:8px;border-radius:50%;background:#E5484D;animation:pulse 1.2s infinite}
.tb-restart{font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--page-line);background:var(--page-card)}

.stage{flex:1;min-height:0;display:flex;gap:24px;align-items:center;justify-content:center;padding-block:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow:auto}
.stage.m-customer .console-wrap{display:none}
.stage.m-agent .device{display:none}
.stage.m-agent .console-wrap{max-width:1440px}
.foot-note{font-size:11.5px;color:var(--page-muted);text-align:center;padding:0 16px 10px}

/* ================= device ================= */
.device{flex:none;width:414px;height:868px;padding:12px;border-radius:58px;background:#05080F;box-shadow:0 0 0 1px #2A3446 inset,0 40px 80px -30px rgba(8,20,45,.55)}
@media (max-height:1010px) and (min-width:521px){ .device{zoom:.86} }
@media (max-height:880px) and (min-width:521px){ .device{zoom:.76} }
@media (max-height:780px) and (min-width:521px){ .device{zoom:.66} }
.screen{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--c-bg);color:var(--c-ink);font-family:var(--c-font);isolation:isolate;font-size:14px}
.statusbar{position:absolute;inset:0 0 auto;height:50px;z-index:40;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 10px 34px;font-weight:600;font-size:15px;color:var(--c-ink);pointer-events:none}
.screen.dark-bar .statusbar{color:#fff}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:41}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--c-ink);opacity:.85;z-index:90;pointer-events:none}
.screen.dark-bar .homebar{background:#fff}

.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--c-bg);transition:transform .42s cubic-bezier(.3,.7,.2,1),opacity .3s;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.before{transform:translateX(-28%);opacity:0;pointer-events:none}
.view.after{transform:translateX(100%);pointer-events:none}
.view.now{transform:none;opacity:1}

/* ---- home / activity ---- */
.home-top{padding:58px 20px 0;display:flex;justify-content:space-between;align-items:center}
.home-top h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.home-top .av{width:36px;height:36px;border-radius:50%;background:var(--c-blue-deep);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.acct{margin:16px 16px 0;padding:18px;border-radius:20px;color:#fff;background:linear-gradient(140deg,#0B2D5B 0%,#00438F 55%,#005EB8 100%);position:relative;overflow:hidden}
.acct::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.acct .lab{font-size:13px;font-weight:600;opacity:.85}
.acct .bal{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.acct .bal small{font-size:20px;opacity:.75}
.acct .sub{font-size:12.5px;opacity:.85;font-variant-numeric:tabular-nums}
.acct .sub b{color:#FFD58A;font-weight:700}
.acct-row{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1}
.acct-row span{flex:1;text-align:center;padding:9px 0;border-radius:999px;background:rgba(255,255,255,.14);font-size:12.5px;font-weight:600}
.rewards{margin:12px 16px 0;padding:12px 14px;background:var(--c-card);border-radius:16px;display:flex;align-items:center;gap:12px}
.rewards .ico{width:36px;height:36px;border-radius:50%;background:var(--c-green-bg);color:var(--c-green);display:grid;place-items:center;flex:none}
.rewards b{font-size:13.5px;display:block}
.rewards span{font-size:12px;color:var(--c-ink2);font-variant-numeric:tabular-nums}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:20px 20px 8px}
.sec-h b{font-size:16px}
.sec-h a{font-size:13px;font-weight:600;color:var(--c-blue);text-decoration:none}
.day{font-size:12px;font-weight:600;color:var(--c-ink3);padding:12px 20px 6px}
.txlist{margin:0 16px;background:var(--c-card);border-radius:16px;overflow:hidden}
.tx{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;position:relative;transition:background .15s}
.tx+.tx::before{content:"";position:absolute;left:66px;right:0;top:0;height:1px;background:var(--c-line)}
.tx:hover{background:#F7F9FB}
.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.logo.lg{width:64px;height:64px;font-size:21px}
.tx-min{min-width:0}
.tx .nm{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .nm.raw{font-family:var(--mono);font-size:12.5px;font-weight:500}
.tx .meta{font-size:12px;color:var(--c-ink3);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tx .amt{text-align:right;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx .amt.in{color:var(--c-green)}
.tx .amt small{display:block;font-size:11.5px;font-weight:600;color:var(--c-green);margin-top:3px}
.tx .amt small.mut{color:var(--c-ink3)}
.tx.hot{box-shadow:inset 3px 0 0 var(--c-blue)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.pending{background:var(--c-amber-bg);color:var(--c-amber)}
.chip.no{background:var(--c-slate-bg);color:var(--c-slate)}
.hint{font-size:12px;color:var(--c-blue);font-weight:600}
.tabbar{position:sticky;bottom:0;margin-top:20px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 28px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--c-line)}
.tabbar span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--c-ink3)}
.tabbar span.on{color:var(--c-blue)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---- detail ---- */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:54px 10px 6px;background:rgba(242,244,247,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.topbar .ttl{font-size:16px;font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--c-ink)}
.iconbtn:hover{background:#E3E7ED}
.d-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 20px 16px;gap:5px}
.d-name{font-size:21px;font-weight:700;margin-top:8px;letter-spacing:-.01em}
.d-sub{font-size:13px;color:var(--c-ink2)}
.d-amt{font-size:36px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px}
.badge.pending{background:var(--c-amber-bg);color:var(--c-amber)}
.badge.settled{background:var(--c-green-bg);color:var(--c-green)}
.badge .d{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.8s infinite}
.raw-line{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:10px}
.raw-line .lab{font-size:11px;color:var(--c-ink3);font-weight:600}
.raw-line code{font-family:var(--mono);font-size:12px;background:var(--c-card);border:1px dashed #C7CFDA;padding:4px 9px;border-radius:8px;color:var(--c-ink2)}
.card{background:var(--c-card);border-radius:16px;margin:0 16px 12px;overflow:hidden}
.explain{padding:16px}
.explain h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:15px;font-weight:700}
.explain h3 .i{width:26px;height:26px;border-radius:50%;background:var(--c-blue-soft);color:var(--c-blue);display:grid;place-items:center}
.explain p{margin:0;font-size:13.5px;line-height:1.55;color:var(--c-ink2)}
.timeline{display:grid;grid-template-columns:1fr 1fr 1fr;margin:14px 0 2px;position:relative}
.timeline::before{content:"";position:absolute;top:6px;left:16.6%;right:16.6%;height:2px;background:linear-gradient(90deg,var(--c-blue) 0 50%,#D5DCE6 50% 100%)}
.timeline.done::before{background:var(--c-green)}
.tl{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;position:relative}
.tl i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #C6CEDA}
.tl.on i{background:var(--c-blue);border-color:var(--c-blue);box-shadow:0 0 0 4px var(--c-blue-soft)}
.tl.ok i{background:var(--c-green);border-color:var(--c-green)}
.tl b{font-size:12px}
.tl span{font-size:11.5px;color:var(--c-ink3)}
.cb-row{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding-top:14px;border-top:1px solid var(--c-line)}
.cb-row .ico{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center}
.ico.ok{background:var(--c-green-bg);color:var(--c-green)} .ico.no{background:var(--c-slate-bg);color:var(--c-slate)} .ico.pend{background:var(--c-amber-bg);color:var(--c-amber)}
.cb-row b{font-size:13.5px;display:block}
.cb-row span{font-size:13px;color:var(--c-ink2);line-height:1.45}
.rows{padding:2px 16px}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;font-size:13.5px}
.row+.row{border-top:1px solid var(--c-line)}
.row .k{color:var(--c-ink3)}
.row .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.row .v.mono{font-family:var(--mono);font-size:12px;font-weight:500}
.map{position:relative;height:110px}
.map svg{display:block;width:100%;height:100%}
.map .pin{position:absolute;left:50%;top:46%;transform:translate(-50%,-100%)}
.loc{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:13.5px}
.loc b{display:block}
.loc span{color:var(--c-ink3);font-size:12.5px}
.more-btn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;font-size:13.5px;font-weight:700;color:var(--c-blue)}
.more-btn svg{transition:transform .25s}
.more-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.support-note{margin:0 16px 12px;padding:12px 14px;border-radius:14px;background:var(--c-blue-soft);font-size:13px;line-height:1.45;color:var(--c-blue-deep);display:flex;gap:10px}
.support-note b{display:block}
.d-actions{position:sticky;bottom:0;padding:14px 16px 30px;background:linear-gradient(180deg,rgba(242,244,247,0) 0%,var(--c-bg) 24%);display:flex;flex-direction:column;gap:8px;z-index:4}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:999px;font-size:15px;font-weight:700;transition:transform .12s,background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--c-blue);color:#fff}
.btn.primary:hover{background:var(--c-blue-press)}
.btn.secondary{background:var(--c-card);color:var(--c-blue);box-shadow:0 0 0 1.5px var(--c-blue) inset}
.btn.plain{background:transparent;color:var(--c-ink2);height:40px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}

/* ---- sheets ---- */
.scrim{position:absolute;inset:0;background:rgba(8,16,30,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--c-card);border-radius:24px 24px 0 0;transform:translateY(102%);transition:transform .42s cubic-bezier(.3,.8,.2,1);display:flex;flex-direction:column;max-height:90%}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:#D3D9E3;margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 4px 20px;flex:none}
.sheet-h h2{margin:0;font-size:18px;font-weight:700}
.sheet-body{overflow-y:auto;padding:0 16px 12px;flex:1;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-foot{padding:10px 16px 30px;border-top:1px solid var(--c-line);flex:none;display:flex;flex-direction:column;gap:6px}
.ctx{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--c-bg);margin:6px 0 4px}
.ctx .logo{width:34px;height:34px;font-size:11px}
.ctx b{font-size:13.5px;display:block}
.ctx span{font-size:12px;color:var(--c-ink3);font-variant-numeric:tabular-nums}
.muted-note{font-size:12px;color:var(--c-ink3);margin:6px 2px 12px;line-height:1.45}
.qa{border:1px solid var(--c-line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.qa > button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:14px;font-size:14.5px;font-weight:600}
.qa > button .qi{width:28px;height:28px;border-radius:50%;background:var(--c-blue-soft);color:var(--c-blue);display:grid;place-items:center;flex:none}
.qa > button svg.chv{margin-left:auto;color:var(--c-ink3);transition:transform .25s;flex:none}
.qa > button[aria-expanded="true"] svg.chv{transform:rotate(180deg)}
.qa .ans{padding:0 14px 14px 52px;animation:rise .25s ease-out both}
.qa .ans p{margin:0;font-size:13.5px;line-height:1.55;color:var(--c-ink2)}
.facts{margin-top:10px;background:var(--c-bg);border-radius:10px;padding:2px 10px}
.facts div{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:7px 0}
.facts div+div{border-top:1px solid var(--c-line)}
.facts span{color:var(--c-ink3)}
.facts b{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.helpful{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--c-ink2);flex-wrap:wrap}
.helpful button{font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:999px;box-shadow:0 0 0 1px var(--c-line) inset}
.helpful button:hover{box-shadow:0 0 0 1px var(--c-blue) inset;color:var(--c-blue)}
.helpful .ok{color:var(--c-green);font-weight:700;display:flex;align-items:center;gap:5px}
.nudge{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--c-blue-soft);font-size:13px;color:var(--c-blue-deep);display:flex;align-items:center;justify-content:space-between;gap:10px}
.nudge button{font-weight:700;color:var(--c-blue);white-space:nowrap;font-size:13px}
.qa.other > button .qi{background:var(--c-slate-bg);color:var(--c-slate)}
.foot-line{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--c-ink2);justify-content:center}
.foot-line i{width:7px;height:7px;border-radius:50%;background:var(--c-green);display:inline-block}
.field-l{font-size:13px;font-weight:700;margin:14px 2px 8px}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topic{font-size:13px;font-weight:600;padding:8px 13px;border-radius:999px;box-shadow:0 0 0 1px var(--c-line) inset;color:var(--c-ink2)}
.topic[aria-pressed="true"]{background:var(--c-blue-soft);box-shadow:0 0 0 1.5px var(--c-blue) inset;color:var(--c-blue-deep)}
.way{width:100%;display:grid;grid-template-columns:38px 1fr 22px;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:14px;box-shadow:0 0 0 1px var(--c-line) inset;margin-bottom:8px}
.way .wi{width:38px;height:38px;border-radius:50%;background:var(--c-bg);display:grid;place-items:center;color:var(--c-blue)}
.way b{display:block;font-size:14.5px}
.way span{font-size:12.5px;color:var(--c-ink2);line-height:1.4}
.way .radio{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px #C3CBD7 inset}
.way[aria-pressed="true"]{box-shadow:0 0 0 2px var(--c-blue) inset;background:#FAFCFF}
.way[aria-pressed="true"] .radio{box-shadow:0 0 0 7px var(--c-blue) inset}
.share-list{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--c-ink2);margin:2px 2px 4px}
.share-list div{display:flex;gap:8px;align-items:center}
.share-list svg{color:var(--c-green);flex:none}

/* ---- handoff (customer) ---- */
.h-hero{padding:4px 24px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{width:80px;height:80px;border-radius:50%;position:relative;display:grid;place-items:center;background:var(--c-blue);color:#fff;margin-bottom:6px;font-weight:700;font-size:24px}
.ring.wait::before,.ring.wait::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--c-blue);opacity:0;animation:ripple 2.4s infinite}
.ring.wait::after{animation-delay:1.2s}
.ring.agent{background:#2E5E7E}
.ring.done{background:var(--c-green)}
@keyframes ripple{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.35);opacity:0}}
.h-title{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.h-sub{font-size:13.5px;color:var(--c-ink2);margin:0;line-height:1.45}
.wait-c{padding:16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.wait-c .lab{font-size:12px;color:var(--c-ink3);font-weight:700}
.wait-c .big{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wait-c .pos{font-size:13px;color:var(--c-ink2);text-align:right}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--c-slate-bg);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--c-blue);border-radius:3px;transition:width 1s linear}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--c-green);font-weight:700}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
.shared-h{padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:baseline}
.shared-h b{font-size:14.5px}
.shared-h span{font-size:12px;color:var(--c-ink3)}
.att-row{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:12px 16px;align-items:start}
.att-row+.att-row{border-top:1px solid var(--c-line)}
.tick{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c-slate-bg);color:var(--c-ink3)}
.tick .spin{width:15px;height:15px;border-radius:50%;border:2px solid #C5CEDB;border-top-color:var(--c-blue);animation:spin .8s linear infinite}
.tick.done{background:var(--c-green-bg);color:var(--c-green)}
.tick.done .spin{display:none}
.tick svg{display:none}
.tick.done svg{display:block;animation:pop .3s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.att-row b{font-size:13.5px;display:block}
.att-row .d{font-size:12.5px;color:var(--c-ink2);line-height:1.45;margin-top:2px}
.att-row .d code{font-family:var(--mono);font-size:11.5px;color:var(--c-ink)}
.att-row ul{margin:4px 0 0;padding-left:16px;font-size:12.5px;color:var(--c-ink2);line-height:1.5}
.reassure{display:flex;gap:10px;align-items:center;margin:0 16px 12px;padding:12px 14px;border-radius:14px;background:var(--c-green-bg);color:var(--c-green);font-size:13px;font-weight:600;line-height:1.4}
.h-actions{padding:4px 16px 34px;display:flex;flex-direction:column;gap:6px}
.textbtn{font-size:14px;font-weight:700;color:var(--c-red);padding:10px}
.thread{margin:0 16px 10px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:84%;font-size:13.5px;line-height:1.5;padding:10px 13px;border-radius:18px;animation:rise .3s ease-out both}
.bub.agent{background:var(--c-card);border-bottom-left-radius:6px;align-self:flex-start}
.bub.me{background:var(--c-blue);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.bub .who{font-size:11px;color:var(--c-ink3);font-weight:700;margin-bottom:2px}
.compose{display:flex;gap:8px;padding:0 16px 12px}
.compose input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--c-line);background:var(--c-card);padding:0 16px;font:inherit;font-size:14px;color:var(--c-ink)}
.compose button{width:44px;height:44px;border-radius:50%;background:var(--c-blue);color:#fff;display:grid;place-items:center;flex:none}
.outcome{padding:16px}
.outcome b{display:block;font-size:14.5px;margin-bottom:4px}
.outcome p{margin:0;font-size:13.5px;color:var(--c-ink2);line-height:1.5}

/* call overlay */
.call{position:absolute;inset:0;z-index:80;background:radial-gradient(120% 80% at 50% 0%,#1A4C8A 0%,#0B2D5B 45%,#06152C 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:110px 28px 60px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
.call.on{opacity:1;pointer-events:auto}
.call .cav{width:96px;height:96px;border-radius:50%;background:#2E5E7E;display:grid;place-items:center;font-size:32px;font-weight:700;margin-bottom:16px;box-shadow:0 0 0 8px rgba(255,255,255,.06)}
.call .cn{font-size:26px;font-weight:700}
.call .cs{font-size:14px;opacity:.8;margin-top:4px}
.call .verified{margin-top:14px;display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px}
.call .ctx-pill{margin-top:10px;font-size:12.5px;opacity:.85;line-height:1.5;max-width:280px}
.call .timer{font-size:15px;margin-top:6px;font-variant-numeric:tabular-nums;opacity:.85}
.call .grow{flex:1}
.call .ctrls{display:grid;grid-template-columns:repeat(3,72px);gap:18px 26px;margin-bottom:34px}
.call .ctrls span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;opacity:.9}
.call .ctrls i{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.call .pair{display:flex;gap:80px}
.call .pair button,.call .end{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px}
.call .pair i,.call .end i{width:70px;height:70px;border-radius:50%;display:grid;place-items:center}
.call .decline i,.call .end i{background:#E5484D}
.call .accept i{background:#30A46C;animation:bob 1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.toast{position:absolute;left:50%;bottom:44px;transform:translate(-50%,20px);background:var(--c-ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .25s,transform .25s;z-index:95;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ================= agent console (SLDS 2 style) ================= */
.console-wrap{flex:1;min-width:0;align-self:stretch;max-height:880px;display:flex}
.sc{container-type:inline-size;flex:1;min-width:0;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#EAF1FE 0%,#F4F7FC 220px,#F4F7FC 100%);color:var(--slds-g-color-neutral-base-10);font-family:var(--slds-g-font-family);font-size:13px;box-shadow:0 30px 60px -30px rgba(8,20,45,.45),0 0 0 1px rgba(3,35,77,.08);position:relative}
.sc-global{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--slds-g-color-neutral-base-100);border-bottom:1px solid var(--slds-g-color-neutral-base-90)}
.sc-org{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--slds-g-color-on-surface-3);white-space:nowrap}
.sc-org .mark{width:28px;height:28px;border-radius:8px;background:var(--slds-g-color-on-surface-3);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.sc-search{flex:1;max-width:520px;margin:0 auto;height:32px;border-radius:var(--slds-g-radius-border-pill);border:1px solid var(--slds-g-color-neutral-base-80);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--slds-g-color-neutral-base-50)}
.sc-icons{display:flex;gap:6px;align-items:center}
.sc-icons span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--slds-g-color-neutral-base-30)}
.sc-icons .me{background:#2E5E7E;color:#fff;font-size:11px;font-weight:700}
.sc-nav{display:flex;align-items:stretch;gap:2px;padding:0 10px;background:var(--slds-g-color-neutral-base-100);border-bottom:1px solid var(--slds-g-color-neutral-base-90);height:40px;overflow-x:auto;scrollbar-width:none}
.sc-nav .app{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:0 12px 0 4px;white-space:nowrap}
.waffle{display:grid;grid-template-columns:repeat(3,4px);gap:2px}
.waffle i{width:4px;height:4px;border-radius:1px;background:var(--slds-g-color-neutral-base-50)}
.wtab{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;white-space:nowrap;border-bottom:3px solid transparent;color:var(--slds-g-color-neutral-base-30)}
.wtab.on{border-bottom-color:var(--slds-g-color-brand-base-50);color:var(--slds-g-color-neutral-base-10);font-weight:600;background:var(--slds-g-color-brand-base-95)}
.wtab .ic{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:#fff}
.sc-sub{display:flex;gap:2px;padding:6px 14px 0;font-size:12.5px}
.sc-sub span{padding:6px 12px;border-radius:8px 8px 0 0;color:var(--slds-g-color-neutral-base-30)}
.sc-sub span.on{background:var(--slds-g-color-neutral-base-100);font-weight:600;color:var(--slds-g-color-neutral-base-10);box-shadow:0 -1px 0 var(--slds-g-color-neutral-base-90)}
.sc-body{flex:1;min-height:0;overflow:auto;padding:12px 14px 14px}
.sc-util{display:flex;gap:2px;padding:0 8px;height:36px;align-items:stretch;background:var(--slds-g-color-neutral-base-100);border-top:1px solid var(--slds-g-color-neutral-base-90);flex:none}
.sc-util button{display:flex;align-items:center;gap:7px;padding:0 12px;font-size:12.5px;color:var(--slds-g-color-neutral-base-30);font-family:var(--slds-g-font-family)}
.sc-util button:hover{background:var(--slds-g-color-neutral-base-95)}
.presence{width:9px;height:9px;border-radius:50%;background:var(--slds-g-color-success-base-50)}
.presence.busy{background:var(--slds-g-color-error-base-50)}

.slds-card{background:var(--slds-g-color-neutral-base-100);border-radius:var(--slds-g-radius-border-4);box-shadow:var(--slds-g-shadow-1);padding:14px 16px;min-width:0}
.slds-card + .slds-card{margin-top:12px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-h h3{margin:0;font-size:14px;font-weight:700}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.obj-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.obj-ic.case{background:#F2536D}.obj-ic.contact{background:#A094ED}.obj-ic.txn{background:#3BA755}.obj-ic.ai{background:var(--slds-g-color-accent-ai)}.obj-ic.kb{background:#EC94ED}.obj-ic.call{background:#F59331}.obj-ic.msg{background:#1AB9FF}.obj-ic.check{background:#06A59A}
.s-badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:var(--slds-g-radius-border-pill);background:var(--slds-g-color-neutral-base-95);color:var(--slds-g-color-neutral-base-30);white-space:nowrap}
.s-badge.success{background:var(--slds-g-color-success-base-95);color:var(--slds-g-color-success-base-50)}
.s-badge.warn{background:#FFF3D9;color:var(--slds-g-color-warning-base-60)}
.s-badge.brand{background:var(--slds-g-color-brand-base-95);color:var(--slds-g-color-brand-base-40)}
.s-badge.ai{background:var(--slds-g-color-accent-ai-95);color:var(--slds-g-color-accent-ai)}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 16px;border-radius:var(--slds-g-radius-border-pill);font-size:13px;font-weight:600;border:1px solid var(--slds-g-color-neutral-base-80);background:var(--slds-g-color-neutral-base-100);color:var(--slds-g-color-brand-base-50);font-family:var(--slds-g-font-family);white-space:nowrap}
.s-btn:hover{background:var(--slds-g-color-neutral-base-95)}
.s-btn.brand{background:var(--slds-g-color-brand-base-50);border-color:var(--slds-g-color-brand-base-50);color:#fff}
.s-btn.brand:hover{background:var(--slds-g-color-brand-base-40)}
.s-btn.destructive{background:var(--slds-g-color-error-base-50);border-color:var(--slds-g-color-error-base-50);color:#fff}
.s-btn.destructive:hover{background:var(--slds-g-color-error-base-40)}
.s-btn.sm{height:28px;padding:0 12px;font-size:12.5px}
.s-btn:disabled{opacity:.5;cursor:default}

.rec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rec-h .t small{display:block;font-size:12px;color:var(--slds-g-color-on-surface-1)}
.rec-h .t b{font-size:17px;font-weight:700}
.rec-h .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.hl{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--slds-g-color-neutral-base-90)}
.hl div{font-size:12px;color:var(--slds-g-color-on-surface-1);display:flex;flex-direction:column;gap:3px}
.hl b{font-size:13px;color:var(--slds-g-color-neutral-base-10);font-weight:600}
.path{display:flex;margin-top:12px}
.path span{flex:1;text-align:center;font-size:12px;font-weight:600;padding:7px 4px;background:var(--slds-g-color-neutral-base-95);color:var(--slds-g-color-neutral-base-30);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%);margin-left:-6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path span:first-child{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);margin-left:0;border-radius:var(--slds-g-radius-border-pill) 0 0 var(--slds-g-radius-border-pill)}
.path span:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,10px 50%);border-radius:0 var(--slds-g-radius-border-pill) var(--slds-g-radius-border-pill) 0}
.path span.done{background:var(--slds-g-color-success-base-50);color:#fff}
.path span.cur{background:var(--slds-g-color-on-surface-3);color:#fff}

.cols{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:12px;margin-top:12px;align-items:start}
@container (max-width:1080px){ .cols{grid-template-columns:minmax(0,1fr) 290px} .cols .c-left{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px} .cols .c-left .slds-card+.slds-card{margin-top:0} }
@container (max-width:760px){ .cols{grid-template-columns:minmax(0,1fr)} .cols .c-left{grid-template-columns:1fr} }
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.fields.one{grid-template-columns:1fr}
.fld{display:flex;flex-direction:column;gap:2px;padding-bottom:6px;border-bottom:1px solid var(--slds-g-color-neutral-base-90);min-width:0}
.fld span{font-size:11.5px;color:var(--slds-g-color-on-surface-1)}
.fld b{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.fld b.mono{font-family:var(--mono);font-size:12px}
.ai-card{border:1px solid #D9C7FB;background:linear-gradient(180deg,#FBF8FF 0%,#FFFFFF 60%)}
.ai-card p{margin:0;line-height:1.55;font-size:13px}
.ai-card .disc{font-size:11.5px;color:var(--slds-g-color-on-surface-1);margin-top:8px}
.ai-card ul{margin:8px 0 0;padding-left:18px;line-height:1.55}
.tline{list-style:none;margin:0;padding:0;position:relative}
.tline li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:0 0 12px;position:relative}
.tline li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--slds-g-color-neutral-base-90)}
.tline li:last-child::before{display:none}
.tline .ti{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;background:#0D9DDA}
.tline .ti.neg{background:#E07A5F}.tline .ti.req{background:#F59331}.tline .ti.ok{background:#3BA755}
.tline b{font-weight:600;font-size:13px}
.tline small{display:block;color:var(--slds-g-color-on-surface-1);font-size:12px;margin-top:1px}
.tline time{font-size:12px;color:var(--slds-g-color-on-surface-1);font-variant-numeric:tabular-nums}
.checks div{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--slds-g-color-neutral-base-90);gap:12px}
.checks div:last-child{border-bottom:0}
.checks span{color:var(--slds-g-color-on-surface-1)}
.nba{display:flex;flex-direction:column;gap:8px}
.nba-item{border:1px solid var(--slds-g-color-neutral-base-90);border-radius:var(--slds-g-radius-border-3);padding:10px 12px}
.nba-item b{display:block;font-size:13px}
.nba-item small{display:block;color:var(--slds-g-color-on-surface-1);font-size:12px;margin:2px 0 8px;line-height:1.4}
.nba-item.done{background:var(--slds-g-color-success-base-95);border-color:#BFE3B4}
.voice{text-align:center}
.voice .who{font-weight:700;font-size:15px;margin-top:6px}
.voice .st{font-size:12.5px;color:var(--slds-g-color-on-surface-1);margin-top:2px}
.voice .tm{font-size:26px;font-weight:300;font-variant-numeric:tabular-nums;margin:8px 0 10px;color:var(--slds-g-color-on-surface-3)}
.voice .av{width:52px;height:52px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:#A094ED;color:#fff;font-weight:700;font-size:16px}
.voice .row-b{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.wave{display:flex;gap:3px;justify-content:center;height:18px;align-items:center;margin-top:8px}
.wave i{width:3px;border-radius:2px;background:var(--slds-g-color-brand-base-50);animation:wv 1s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wv{0%,100%{height:4px}50%{height:16px}}
.transcript{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;padding:2px}
.tmsg{max-width:88%;padding:7px 10px;border-radius:12px;font-size:12.5px;line-height:1.45}

const TEAM = { unrec:'Fraud & disputes', other:'Card payments', twice:'Card payments', cash:'Rewards', settle:'Card payments' };

function answersFor(t){
  if (t.answers) return t.answers;
  const settled = t.status === 'settled';
  return {
    twice:{ text:`You were charged once. There’s a single ${money(t.amount)} payment to ${t.name} on ${t.short}.`, facts:[['Payments (30 days)','1'],['Status', settled ? 'Settled' : 'Pending']] },
    cash:{ text: t.cb.state === 'ok' ? `This payment earned cashback (${t.cb.title.split('· ')[1]}), already paid into your account.` : `${t.cb.title}. ${t.cb.text}`, facts:[['Cashback', t.cb.title]] },
    settle:{ text: settled ? `This payment settled on ${t.short}. The amount is final.` : 'This should settle within 2–3 working days.', facts:[['Status', settled ? 'Settled ' + t.short : 'Pending']] }
  };
}

  open:null, viewed:[], feedback:{}, topic:null, channel:'call',
  phase:'idle',          // idle | queue | incoming | active | wrap | closed
  callState:null,        // ringing | connected | ended
  callSecs:0, msgs:[], journey:[], usedSugg:[], nba:{}, outcome:null, caseOpen:false, timers:[], clock:0, toastMsg:null
};
function stamp(){ const m = 58 + Math.floor(S.clock/2); S.clock++; const h = 19 + Math.floor(m/60); return h + ':' + String(m%60).padStart(2,'0'); }
function log(kind, title, sub){ S.journey.push({kind, title, sub, t:stamp()}); if (S.mode !== 'customer') renderConsole(); }

    rows += `<div class="day">${day}</div><div class="txlist">`;

  const t = S.txn, a = answersFor(t);

    let body = '';
    if (open){
      body = `<div class="ans"><p>${esc(a[k].text)}</p>
        <div class="facts">${a[k].facts.map(f => `<div><span>${esc(f[0])}</span><b>${esc(f[1])}</b></div>`).join('')}</div>
        <div class="helpful">${fb === 'yes' ? `<span class="ok">${I.check}Thanks, glad that helped</span>`

function openTxn(id){

function resetCase(){

function request(){
  S.phase = 'queue';
  log('req', S.channel === 'call' ? 'Requested a call back' : 'Started a message request', `Topic: ${TOPICS[S.topic]}`);
  sheet(null); renderHandoff(); go('handoff'); renderConsole(); syncBadge();
  let remaining = 120;
  const tick = () => {
    remaining = Math.max(0, remaining - 20);
    const big = $('#wait-big'), pos = $('#wait-pos'), bar = $('#wait-bar');
    const p = remaining > 80 ? 3 : remaining > 40 ? 2 : 1;
    if (big){ big.textContent = remaining >= 60 ? `About ${Math.ceil(remaining/60)} min` : remaining > 0 ? 'Under 1 min' : 'Any moment'; pos.textContent = p === 1 ? 'You’re next' : `You’re ${p === 2 ? '2nd' : '3rd'} in line`; bar.style.width = (100 - remaining/120*92) + '%'; }
    if (remaining > 0) later(tick, 1000);
    else { S.phase = 'incoming'; renderConsole(); syncBadge(); if (S.mode === 'customer') later(() => S.phase === 'incoming' && accept(), 2500); }
  };
  later(tick, 1200);
}
function accept(){
  if (S.phase !== 'incoming') return;
  S.phase = 'active'; S.caseOpen = true;
  log('ok', 'Accepted by Priya Kaur', `${TEAM[S.topic] || 'Card payments'} · Case ${caseNo()}`);
  if (S.channel === 'call'){
    S.callState = 'ringing'; S.callHidden = false;
    renderCall();
    if (S.mode === 'agent') later(answer, 2500);
  } else {
    const t = S.txn;
    const first = S.topic === 'unrec'
      ? `Hi ${CUSTOMER.first}, I’m Priya. I can see you don’t recognise the ${money(t.amount)} payment shown as ${t.raw}. I’ll go through it with you now.`
      : `Hi ${CUSTOMER.first}, I’m Priya. I can see your ${money(t.amount)} ${t.status} payment to ${t.name} and what you read in the app, so no need to explain. Give me a moment to check.`;
    S.msgs.push({from:'agent', text:first});

}
function answer(){
  if (S.callState !== 'ringing') return;

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-open],[data-action],[data-q],[data-fb],[data-topic-pick],[data-way],[data-jump],[data-mode],[data-sugg],[data-nba]');

  if (d.q){
    const k = d.q; S.open = S.open === k ? null : k;
    if (S.open && !S.viewed.includes(k)){ S.viewed.push(k); log('', 'Read answer: “' + QS.find(q => q[0] === k)[1] + '”'); }
    return renderAnswers();
  }
  if (d.fb){
    S.feedback[d.k] = d.fb;
    if (d.fb === 'no'){ S.topic = d.k; log('neg', 'Marked answer not helpful', '“' + QS.find(q => q[0] === d.k)[1] + '”'); }
    else log('ok', 'Marked answer helpful', '“' + QS.find(q => q[0] === d.k)[1] + '”');
    return renderAnswers();
  }
  if (d.topicPick){ S.topic = d.topicPick; return renderContact(); }
  if (d.way){ S.channel = d.way; return renderContact(); }
  if (d.sugg){ const i = +d.sugg; S.usedSugg.push(i); return agentSend(suggestions()[i]); }
  if (d.nba){
    S.nba[d.nba] = true;
    if (d.nba === 'note') log('ok', 'Explanation sent to app', 'Note added to payment');
    if (d.nba === 'freeze') log('ok', 'Card frozen by agent');
    if (d.nba === 'dispute') log('ok', 'Dispute raised', money(S.txn.amount));
    return renderConsole();
  }
  switch (d.action){
    case 'back': sheet(null); go('list'); break;
    case 'back-detail': renderDetail(); go('detail'); break;
    case 'toggle': { const open = el.getAttribute('aria-expanded') !== 'true'; el.setAttribute('aria-expanded', open); $('#' + el.getAttribute('aria-controls')).hidden = !open; break; }
    case 'answers': renderAnswers(); sheet('answers'); break;
    case 'contact': if (d.topic) S.topic = d.topic; if (S.phase !== 'idle'){ sheet(null); renderHandoff(); go('handoff'); break; } renderContact(); sheet('contact'); break;
    case 'close-sheets': sheet(null); break;
    case 'request': request(); break;
    case 'cancel': resetCase(); renderDetail(); go('detail'); renderConsole(); syncBadge(); toast('Request cancelled'); break;
    case 'accept': accept(); break;
    case 'answer': answer(); break;
    case 'decline': hangup(); break;
    case 'hangup': hangup(); break;
    case 'hide-call': S.callHidden = true; renderCall(); renderHandoff(); break;
    case 'show-call': S.callHidden = false; renderCall(); break;
    case 'end-msg': endMsg(); break;
    case 'close-case': closeCase(); break;
    case 'done': renderDetail(); go('detail'); break;
    case 'restart': restart(); break;
    case 'omni': break;
    case 'noop': toast('Not part of this prototype'); break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'cust-compose'){
    const v = $('#cust-input').value.trim(); if (!v) return;
    S.msgs.push({from:'customer', text:v}); renderHandoff(); renderConsole();
    const i = $('#cust-input'); i && i.focus();
  } else if (e.target.id === 'agent-compose'){
    const v = $('#agent-input').value.trim(); if (!v) return; agentSend(v);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) sheet(null); });

renderList(); go('list');
setMode(window.innerWidth >= 1280 ? 'split' : 'customer');
})();
</script>
</body>
