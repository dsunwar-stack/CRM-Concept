<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Assistant for Bank</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --header: #1f232a;
      --text: #18212f;
      --muted: #637084;
      --line: #e2e8f2;
      --blue: #0076a9;
      --green: #27ae60;
      --danger: #d92d20;
      --desk-expanded: 270px;
      --desk-collapsed: 72px;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(17, 25, 40, 0.08);
      --panel-transition: 250ms cubic-bezier(0.2, 0.8, 0.2, 1);
      --app-height: 100vh;
    }

    @supports (height: 100dvh) {
      :root { --app-height: 100dvh; }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }

    button { font-family: inherit; }

    /* ── Top bar ── */
    .topbar {
      height: 56px;
      background: var(--header);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }

    .logo {
      width: 30px;
      height: 32px;
      border-radius: 2px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .logo img { width: 100%; height: 100%; object-fit: contain; display: block; position: relative; z-index: 1; background: var(--header); }
    .logo { position: relative; }
    /* Shown only when assets/logo.png is missing */
    .logo-fallback { position: absolute; inset: 3px; border-radius: 4px; background: #117aca; }

    .search {
      width: min(460px, 45vw);
      background: #252b35;
      border: 1px solid rgba(255,255,255,0.25);
      color: #d7e1f3;
      border-radius: 8px;
      height: 36px;
      padding: 0 12px;
      outline: none;
    }

    .topbar-right { display: flex; align-items: center; gap: 12px; font-size: 13px; }

    .top-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #2f3642;
      display: grid;
      place-items: center;
      color: #c8d4e8;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      border: none;
      transition: background 140ms ease;
    }

    .top-icon:hover { background: #3a4251; }
    .top-icon svg { width: 18px; height: 18px; }

    .top-icon .dot {
      position: absolute;
      top: 5px;
      right: 6px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f0a000;
      display: none;
    }
    .top-icon.has-dot .dot { display: block; }

    .cs-icon path,
    .cs-icon circle,
    .cs-icon rect { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .cs-icon .stroke-linejoin-round { stroke-linejoin: round; }
    .cs-icon .stroke-linecap-round  { stroke-linecap: round; stroke-linejoin: round; }

    /* ── Shell layout ── */
    .shell {
      --desk-width: var(--desk-expanded);
      display: grid;
      grid-template-columns: var(--desk-width) 1fr;
      transition: grid-template-columns var(--panel-transition);
      min-height: calc(var(--app-height) - 56px);
      height: calc(var(--app-height) - 56px);
    }

    .shell.collapsed { grid-template-columns: var(--desk-collapsed) 1fr; }

    /* ── Agent Desk panel ── */
    .desk {
      border-right: 1px solid var(--line);
      background: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .resizer {
      position: absolute;
      top: 0;
      right: 0;
      width: 8px;
      height: 100%;
      cursor: col-resize;
      z-index: 20;
    }

    .resizer::after {
      content: "";
      position: absolute;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 42px;
      border-radius: 999px;
      background: #c7d5ec;
      opacity: 0.7;
      transition: opacity 140ms ease;
    }

    .resizer:hover::after,
    .resizer.dragging::after { opacity: 1; background: #8fb0e8; }

    .desk-toolbar {
      padding: 10px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .toggle {
      border: 1px solid #b7c7e2;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff;
      box-shadow: var(--shadow);
      cursor: pointer;
      color: #2d4b7f;
      font-size: 14px;
      flex-shrink: 0;
      transition: transform 140ms ease;
    }

    .toggle:hover { transform: translateY(-1px); }

    .status-pill {
      flex: 0 0 auto;
      border: 1px solid #8cc8a4;
      color: #0a6f3b;
      background: #e7f8ef;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .status-pill .cs-icon { width: 13px; height: 13px; flex-shrink: 0; }
    .status-pill .caret { font-size: 10px; margin-left: 2px; }

    .status-pill.break   { border-color: #f0c36d; color: #8a5a00; background: #fff6e0; }
    .status-pill.offline { border-color: #c4cdd8; color: #4b5868; background: #f0f2f5; }

    .status-menu {
      position: absolute;
      top: 48px;
      left: 46px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(17,25,40,0.14);
      padding: 4px;
      z-index: 30;
      display: none;
      min-width: 150px;
    }
    .status-menu.open { display: block; }

    .status-option {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      border: none;
      background: transparent;
      padding: 8px 10px;
      font-size: 13px;
      text-align: left;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
    }
    .status-option:hover { background: #f0f4fb; }
    .status-swatch { width: 8px; height: 8px; border-radius: 50%; }

    /* ── Chat contact list ── */
    .queue {
      padding: 8px 6px 0;
      display: grid;
      gap: 8px;
      overflow-y: auto;
      flex: 0 0 auto;
      max-height: 230px;
    }

    .queue-empty {
      font-size: 12px;
      color: var(--muted);
      padding: 10px 6px;
      text-align: center;
    }

    .call-card {
      background: #fff;
      border: 1px solid #ced9ec;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: border-color 180ms ease, transform 180ms ease;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .call-card:hover {
      border-color: #0076a9;
      background: #e8f4fd;
      transform: translateY(-1px);
    }

    .call-card.active.selected {
      border-color: #0076a9;
      background: #0076a9;
      box-shadow: 0 2px 6px rgba(0,118,169,0.35);
    }

    .call-card.active.selected .name,
    .call-card.active.selected .meta { color: #fff; }

    .call-card.ended:not(.selected) { opacity: 0.7; }

    @keyframes ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(240,160,0,0.45); }
      50%      { box-shadow: 0 0 0 6px rgba(240,160,0,0); }
    }

    .call-card.incoming {
      border-color: #f0a000;
      background: #fff8e6;
      animation: ring 1.4s infinite;
      cursor: default;
    }
    .call-card.incoming:hover { transform: none; background: #fff8e6; }

    .incoming-actions { display: flex; gap: 6px; margin-top: 8px; }

    .incoming-actions button {
      flex: 1;
      height: 26px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-accept  { border: none; background: var(--green); color: #fff; }
    .btn-decline { border: 1px solid #d0d7e2; background: #fff; color: #4b5868; }

    .call-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: #f0f2f5;
      color: #5a6f8e;
    }
    .call-icon.chat-active   { background: #e8f4fd; color: #0076a9; }
    .call-icon.chat-selected { background: #fff; color: #0076a9; }
    .call-icon.chat-incoming { background: #ffe9b8; color: #8a5a00; }
    .call-icon svg { width: 16px; height: 16px; }

    .unread-badge {
      position: absolute;
      top: -5px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--danger);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    .call-card-body { flex: 1; min-width: 0; }

    .name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }

    .meta {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }

    /* ── Live chat panel ── */
    .live-chat-panel {
      margin-top: 16px;
      border-top: 2px solid var(--line);
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      background: #fff;
    }

    .active-strip {
      background: #0076a9;
      color: #fff;
      padding: 10px;
      font-size: 13px;
      display: grid;
      gap: 8px;
      border-bottom: 1px solid #005f87;
      flex-shrink: 0;
      font-family: "Open Sans", sans-serif;
    }
    .active-strip.ended { background: #5b6c7b; border-bottom-color: #4b5868; }

    .active-strip-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    .active-strip-sub {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      color: rgba(255, 255, 255, 0.92);
      white-space: nowrap;
    }

    .live-chat-msgs {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .live-chat-empty {
      flex: 1;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 20px;
    }

    .lc-bubble-row { display: flex; flex-direction: column; gap: 4px; }
    .lc-bubble-row.new { animation: ai-fade-in 0.3s ease; }
    .lc-bubble-row.incoming { align-items: flex-start; }
    .lc-bubble-row.outgoing { align-items: flex-end; }

    .lc-meta { display: flex; align-items: center; gap: 6px; padding: 0 2px; }
    .lc-bubble-row.outgoing .lc-meta { flex-direction: row-reverse; }

    .lc-sender { font-size: 11px; font-weight: 600; color: #5f6b7a; line-height: 1.4; }
    .lc-time   { font-size: 11px; color: #8d99a5; line-height: 1.4; }

    .lc-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      line-height: 1;
    }
    .lc-avatar.incoming { background: #e8f4fd; color: #0972d3; }
    .lc-avatar.outgoing { background: #0972d3; color: #fff; }

    .lc-bubble {
      font-size: 13px;
      line-height: 1.5;
      padding: 8px 12px;
      max-width: 85%;
      word-break: break-word;
    }

    .lc-bubble.from-customer {
      background: #f4f4f4;
      color: #0f1111;
      border-radius: 0 12px 12px 12px;
      border: 1px solid #e9ebed;
    }

    .lc-bubble.from-agent {
      background: #f0fbff;
      color: #0f1111;
      border: 1.5px solid #d1f1ff;
      border-radius: 12px 0 12px 12px;
    }

    .lc-read-receipt {
      font-size: 11px;
      color: #5f6b7a;
      align-self: flex-end;
      padding-right: 2px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .lc-system {
      align-self: center;
      font-size: 11px;
      color: #4b5868;
      background: #f0f2f5;
      border-radius: 999px;
      padding: 3px 10px;
      margin: 4px 0;
    }

    .live-chat-footer {
      border-top: 1px solid var(--line);
      padding: 8px;
      display: flex;
      gap: 5px;
      align-items: center;
      flex-shrink: 0;
      background: #fff;
    }

    .live-chat-footer input {
      flex: 1;
      min-width: 0;
      border: 1px solid #cfd8e7;
      border-radius: 4px;
      height: 30px;
      padding: 0 8px;
      font-size: 12px;
      outline: none;
    }
    .live-chat-footer input:focus { border-color: #0f62fe; box-shadow: 0 0 0 2px rgba(15,98,254,0.12); }
    .live-chat-footer input:disabled { background: #f5f7f8; }

    .lc-send-btn {
      border: none;
      background: var(--blue);
      color: #fff;
      border-radius: 4px;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .lc-send-btn:disabled { background: #a9b6c4; cursor: not-allowed; }
    .lc-send-btn svg { width: 13px; height: 13px; }

    .btn-end-chat {
      flex-shrink: 0;
      border: none;
      background: var(--danger);
      color: #fff;
      border-radius: 999px;
      height: 30px;
      padding: 0 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }
    .btn-end-chat.close { background: #4b5868; }

    /* ── Collapsed Agent Desk ── */
    .shell.collapsed .desk .status-pill,
    .shell.collapsed .desk .call-card-body,
    .shell.collapsed .desk .live-chat-panel { display: none; }

    .shell.collapsed .desk .call-card {
      padding: 10px 8px;
      min-height: 44px;
      display: grid;
      place-items: center;
    }

    .shell.collapsed .desk .call-icon { width: 30px; height: 30px; }
    .shell.collapsed .toggle { transform: rotate(180deg); }
    .shell.collapsed .resizer { pointer-events: none; opacity: 0.2; }

    /* ── Main content ── */
    .main {
      padding: 0 46px 0 14px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .breadcrumb {
      height: 38px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 13px;
      color: #5a6f8e;
      gap: 8px;
    }

    .panels-bar { width: 100%; display: grid; grid-template-columns: 1.05fr 1fr; min-height: 44px; }
    .panels-bar-left, .panels-bar-right { display: flex; align-items: center; padding: 0 14px; }
    .panels-bar-right { font-size: 13px; color: var(--muted); }

    .page {
      width: 100%;
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 0 24px;
      min-height: 0;
      height: calc(var(--app-height) - 138px);
    }

    .page-top-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      align-items: center;
    }

    .page-top-left, .page-top-right { padding: 0 14px; min-height: 30px; display: flex; align-items: center; }

    .panel {
      grid-row: 2;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 10px; align-items: center; font-size: 13px; font-weight: 600; }

    .tab-btn {
      border: none;
      background: transparent;
      color: #51627b;
      padding: 0 0 8px;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font: inherit;
    }
    .tab-btn.active { color: #1f5ec8; border-bottom-color: #1f5ec8; }

    /* ── Responses panel ── */
    .resp-panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      font-family: "Open Sans", sans-serif;
    }

    .resp-search-wrap { padding: 10px 12px 8px; flex-shrink: 0; }

    .resp-search {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #c8d6ea;
      border-radius: 8px;
      padding: 6px 10px;
      background: #fff;
    }
    .resp-search:focus-within { border-color: #005EB8; box-shadow: 0 0 0 2px rgba(0,94,184,0.12); }

    .resp-search input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 13px;
      color: #485c78;
      background: transparent;
      font-family: inherit;
    }
    .resp-search input::placeholder { color: #a0afc0; }

    .resp-search-clear {
      border: none;
      background: transparent;
      color: #8d99a5;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      display: none;
    }
    .resp-search.has-value .resp-search-clear { display: block; }

    .resp-filters { display: flex; gap: 6px; padding: 0 12px 10px; flex-shrink: 0; }

    .resp-filter-pill {
      border: 1px solid #c8d6ea;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: #fff;
      color: #485c78;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .resp-filter-pill svg path, .resp-filter-pill svg rect { stroke: currentColor; }
    .resp-filter-pill.active { background: #1f5ec8; color: #fff; border-color: #1f5ec8; }

    .resp-list { flex: 1; overflow-y: auto; min-height: 0; }

    .resp-empty { padding: 24px 12px; font-size: 13px; color: var(--muted); text-align: center; }

    .resp-category-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 8px;
      background: #F5F7F8;
      border-bottom: 1px solid #E2E4E5;
      font-size: 14px;
      font-weight: 600;
      color: #434F5B;
      line-height: 20px;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .resp-category-header .cat-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .resp-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid #edf2fa;
      cursor: pointer;
      transition: background 0.12s;
    }
    .resp-item:hover { background: #f5f8ff; }

    .resp-item-left { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }

    .resp-item-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .resp-item-icon.critical  { background: #fff3f3; }
    .resp-item-icon.urgent    { background: #fff7ed; }
    .resp-item-icon.standard  { background: #edf5ff; }
    .resp-item-icon.transfer  { background: #f0f4fb; }
    .resp-item-icon.closed    { background: #f5f5f5; }
    .resp-item-icon.location  { background: #edf5ff; }
    .resp-item-icon.card      { background: #fff7ed; }
    .resp-item-icon.reissue   { background: #edf5ff; }
    .resp-item-icon.freeze    { background: #f0f4fb; }

    .resp-item-text { min-width: 0; }

    .resp-item-title { font-size: 16px; color: #0F171F; line-height: 24px; }

    .resp-item-sub { font-size: 12px; line-height: 16px; color: #434F5B; margin-top: 1px; }

    .resp-item-count {
      font-size: 11px;
      color: #5b6c7b;
      background: #eef2f8;
      border-radius: 999px;
      padding: 1px 7px;
      margin-right: 8px;
    }

    .resp-item-right { display: flex; align-items: center; }
    .resp-item-chevron { transition: transform 0.2s; }
    .resp-item.open .resp-item-chevron { transform: rotate(90deg); }

    .resp-expand-panel { display: none; flex-direction: column; width: 100%; background: #fff; }
    .resp-expand-panel.open { display: flex; }

    .resp-expand-row {
      display: flex;
      width: 100%;
      padding: 12px 0 12px 16px;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      border-bottom: 1px solid #d3d9de;
      background: #FFF;
    }
    .resp-expand-row:hover { background: #f8fbff; }

    .resp-expand-row-inner {
      display: flex;
      width: 100%;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .resp-expand-text {
      color: #434F5B;
      font-size: 12px;
      line-height: 16px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }
    .resp-expand-text:hover { color: #0F171F; }
    .resp-expand-text.expanded { display: block; overflow: visible; -webkit-line-clamp: unset; }

    .resp-show-more {
      background: none;
      border: none;
      padding: 0;
      font-size: 11px;
      font-weight: 600;
      color: #005EB8;
      cursor: pointer;
      line-height: 16px;
    }
    .resp-show-more:hover { text-decoration: underline; }

    .resp-row-actions { display: flex; align-items: center; gap: 2px; padding-right: 8px; flex-shrink: 0; }

    .resp-use-btn {
      border: 1px solid #005EB8;
      background: #fff;
      color: #005EB8;
      border-radius: 4px;
      height: 24px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .resp-use-btn:hover { background: #e8f0fb; }

    .resp-copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0 4px;
      opacity: 0.7;
      transition: opacity 0.15s;
    }
    .resp-copy-btn:hover { opacity: 1; }

    .resp-footer {
      padding: 10px 12px;
      flex-shrink: 0;
      border-top: 1px solid #edf2fa;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .demo-label { font-size: 11px; color: #8d99a5; }
    [hidden] { display: none !important; }

    .resp-feedback-btn {
      border: none;
      background: transparent;
      color: #1f5ec8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0;
    }

    /* ── History tab ── */
    .history-card {
      border: 1px solid #d7e2f3;
      border-radius: 10px;
      background: #f9fbff;
      padding: 10px;
    }
    .history-card h4 { margin: 0 0 6px; font-size: 13px; color: #2a4977; }
    .history-card p  { margin: 0; font-size: 13px; color: #485c78; line-height: 1.4; }
    .history-card .history-tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #005EB8;
      background: #e8f0fb;
      border-radius: 999px;
      padding: 2px 8px;
    }

    /* ── Right assistant panel ── */
    .assistant { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }

    .assistant-body { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; }

    /* ── Accordions ── */
    .accordion { display: flex; flex-direction: column; flex-shrink: 0; }
    .accordion-body { overflow-y: auto; max-height: 300px; }
    .accordion-body.collapsed { display: none; }

    .accordion.qa-accordion { flex: 1 0 auto; min-height: 0; }
    .accordion.qa-accordion .accordion-body { max-height: none; }

    .accordion-header {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 14px;
      background: #EEF2F8;
      border: none;
      cursor: pointer;
      font-family: "Open Sans", sans-serif;
      font-weight: 600;
      font-size: 16px;
      line-height: 24px;
      color: #0F171F;
      text-align: left;
    }
    .accordion-header:hover { background: #e4eaf5; }
    .accordion-header[aria-expanded="false"] { background: transparent; }
    .accordion-header[aria-expanded="false"]:hover { background: #e4eaf5; }

    .accordion-header .chevron {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: #005EB8;
      transition: transform 200ms ease;
    }
    .accordion-header[aria-expanded="false"] .chevron { transform: rotate(-90deg); }

    .accordion-header .acc-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      background: #005EB8;
      border-radius: 999px;
      padding: 1px 8px;
    }

    .accordion-body-inner { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

    /* ── Prior history block ── */
    .history {
      border: 1px solid #D3D9DE;
      border-radius: 10px;
      padding: 10px;
      display: grid;
      gap: 6px;
      font-size: 13px;
    }

    .history-row { display: flex; justify-content: space-between; color: #305486; gap: 8px; }
    .history-row + .history-row { border-top: 1px solid #e2e8f2; padding-top: 6px; margin-top: 2px; }

    .link-btn {
      border: none;
      background: transparent;
      padding: 0;
      color: #005EB8;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }
    .link-btn.strong { font-weight: 600; }
    .link-btn:hover { text-decoration: underline; }

    .summary-detail {
      display: none;
      gap: 8px;
      padding: 8px 0 4px;
      border-top: 1px solid #e2e8f2;
      font-family: "Open Sans", sans-serif;
    }
    .summary-detail.open { display: grid; }
    .summary-detail .sd-title { font-weight: 600; color: #0F171F; font-size: 13px; }
    .summary-detail .sd-meta  { font-size: 12px; color: var(--muted); }
    .summary-detail dt { font-size: 12px; font-weight: 600; color: #434F5B; }
    .summary-detail dd { margin: 0 0 6px; font-size: 13px; color: #485c78; line-height: 1.45; }

    /* ── Suggested responses ── */
    .sugg-placeholder { font-size: 13px; color: var(--muted); font-family: "Open Sans", sans-serif; }

    .suggestion-card {
      border: 1px solid #D3D9DE;
      border-radius: 12px;
      padding: 10px 12px;
      background: #FFF;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .suggestion-card + .suggestion-card { margin-top: 8px; }
    .suggestion-card.primary { border-color: #8fb0e8; }

    .suggestion-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }

    .suggestion-title-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: "Open Sans", sans-serif;
      font-weight: 600;
      font-size: 14px;
      line-height: 20px;
      color: #101820;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      text-align: left;
      flex: 1;
      min-width: 0;
    }

    .suggestion-title-label img { width: 16px; height: 16px; flex-shrink: 0; transition: transform 200ms ease; }
    .suggestion-card.collapsed .suggestion-title-label img { transform: rotate(-90deg); }
    .suggestion-card.collapsed .suggestion-body { display: none; }

    .best-tag {
      font-size: 10px;
      font-weight: 700;
      color: #1a7f4b;
      background: #e7f8ef;
      border-radius: 999px;
      padding: 1px 7px;
      white-space: nowrap;
    }

    .sugg-actions { display: flex; gap: 10px; flex-shrink: 0; }

    .copy-btn {
      border: none;
      background: transparent;
      color: #005EB8;
      font-family: "Open Sans", sans-serif;
      font-size: 14px;
      font-weight: 600;
      line-height: 20px;
      cursor: pointer;
      padding: 0;
    }
    .copy-btn:hover { text-decoration: underline; }

    .suggestion-body { width: 100%; }

    .suggestion-text {
      font-family: "Open Sans", sans-serif;
      font-size: 14px;
      line-height: 20px;
      color: #434F5B;
      margin: 0;
    }

    .suggestion-text-shell, .iqa-text-shell { position: relative; }

    .suggestion-text-wrap {
      max-height: 80px;
      overflow-y: hidden;
      scrollbar-width: thin;
      scrollbar-color: #c4cdd8 transparent;
    }

    .suggestion-text-shell.has-overflow .suggestion-text-wrap,
    .iqa-text-shell.has-overflow .iqa-text-wrap { overflow-y: auto; }

    .suggestion-text-wrap::-webkit-scrollbar,
    .iqa-text-wrap::-webkit-scrollbar { width: 4px; }
    .suggestion-text-wrap::-webkit-scrollbar-thumb,
    .iqa-text-wrap::-webkit-scrollbar-thumb { background: #c4cdd8; border-radius: 2px; }

    .text-fade {
      position: absolute;
      bottom: 0;
      left: 1px;
      right: 1px;
      height: 40px;
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 100%);
      pointer-events: none;
      transition: opacity 120ms ease;
    }
    .text-fade.hidden { opacity: 0; }

    .suggestion-title-row { flex-wrap: wrap; }
    .copy-btn.subtle { color: #5b6c7b; font-size: 13px; }
    .sugg-feedback {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      width: 100%;
      font-size: 12px;
      color: #434F5B;
    }
    .reason-chip {
      border: 1px solid #c8d6ea;
      background: #fff;
      color: #485c78;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 12px;
      cursor: pointer;
    }
    .reason-chip:hover { border-color: #005EB8; color: #005EB8; }
    .sugg-feedback-done { color: #1a7f4b; font-weight: 600; }
    .link-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .link-chip {
      border: 1px dashed #a9b6c4;
      background: #f5f7f8;
      color: #434F5B;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 12px;
      cursor: help;
    }
    .helpful-links-label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 6px; }

    /* ── IQA ── */
    .iqa-block {
      display: flex;
      flex-direction: column;
      font-family: "Open Sans", sans-serif;
      font-size: 14px;
      line-height: 20px;
    }

    .iqa-block p { font-size: 14px; line-height: 20px; color: #485c78; margin: 0 0 8px; }
    .iqa-block p:last-of-type { margin-bottom: 0; }

    .iqa-question {
      align-self: flex-end;
      background: #f0fbff;
      border: 1px solid #d1f1ff;
      border-radius: 12px 0 12px 12px;
      padding: 6px 10px;
      font-size: 13px;
      color: #0f171f;
      margin-bottom: 10px;
      max-width: 90%;
    }

    .iqa-text-wrap {
      max-height: 160px;
      overflow-y: hidden;
      padding-right: 6px;
      scrollbar-width: thin;
      scrollbar-color: #c4cdd8 transparent;
    }

    .iqa-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .iqa-header strong { font-weight: 600; font-size: 14px; color: #18212f; }

    .ai-badge {
      display: inline-flex;
      height: 20px;
      padding: 1px 6px 3px;
      justify-content: center;
      align-items: center;
      gap: 4px;
      border-radius: 12px;
      background: radial-gradient(125.99% 125.99% at 5.75% 22.5%, #F4EBD9 0%, #F7F1E5 19.1%, #F3F3E9 35.4%, #EBEFEF 49.71%, #D9ECF4 68%, #CBD9EA 100%);
      font-size: 11px;
      font-weight: 600;
      color: #2D1F4E;
      white-space: nowrap;
    }
    .ai-badge img { width: 14px; height: 14px; }

    .feedback-btns { display: flex; gap: 8px; align-items: center; }

    .feedback-btn {
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      color: #005EB8;
      display: grid;
      place-items: center;
      transition: color 120ms ease, transform 120ms ease;
    }
    .feedback-btn:hover { color: #003d7a; transform: scale(1.15); }
    .feedback-btn.active-up   { color: #1a7a47; }
    .feedback-btn.active-down { color: #c0392b; }
    .feedback-btn .cs-icon { width: 20px; height: 20px; }
    .feedback-btn.active-up .cs-icon path,
    .feedback-btn.active-down .cs-icon path { fill: currentColor; fill-opacity: 0.15; }

    .iqa-ask {
      border-top: 1px solid var(--line);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      background: #fff;
    }

    .iqa-ask-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    .iqa-ask-top select {
      border: 1px solid #cfd8e7;
      border-radius: 4px;
      height: 32px;
      color: #5f6f87;
      padding: 0 8px;
      background: #fff;
      font-size: 13px;
    }

    .iqa-ask-top .new-btn {
      border: none;
      background: transparent;
      color: #005EB8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .iqa-quick { display: flex; flex-wrap: wrap; gap: 6px; }
    .iqa-quick button {
      border: 1px solid #c8d6ea;
      background: #fff;
      color: #485c78;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .iqa-quick button:hover { border-color: #005EB8; color: #005EB8; }

    .iqa-ask-input-row { display: flex; align-items: center; gap: 6px; }

    .iqa-ask-input-row input {
      flex: 1;
      border: 1px solid #cfd8e7;
      border-radius: 4px;
      height: 36px;
      padding: 0 10px;
      font-size: 13px;
      outline: none;
    }
    .iqa-ask-input-row input:focus { border-color: #0f62fe; box-shadow: 0 0 0 2px rgba(15,98,254,0.15); }

    .iqa-send-btn {
      border: none;
      background: var(--blue);
      color: #fff;
      border-radius: 4px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .iqa-send-btn svg { width: 16px; height: 16px; }

    .iqa-hint { font-size: 11px; color: var(--muted); margin: 0; }

    /* ── Clarification card ── */
    .clarif-card {
      position: relative;
      border-radius: 8px;
      background: #ffffff;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .clarif-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 8px;
      padding: 1px;
      background: linear-gradient(315deg, #D3D9DE 0.01%, #2CABCE 15%, #0B76DA 35%, #004692 45%, #002F6C 50%, #A86800 60%, #CC8500 75%, #F0A000 85%, #D3D9DE 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .clarif-header { display: flex; align-items: center; justify-content: space-between; }
    .clarif-title {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      font-family: "Open Sans", sans-serif;
      font-weight: 600;
      font-size: 13px;
      color: #005EB8;
    }
    .clarif-close { border: none; background: transparent; color: #637084; font-size: 18px; cursor: pointer; padding: 0 2px; line-height: 1; }
    .clarif-close:hover { color: #18212f; }
    .clarif-q { font-family: "Open Sans", sans-serif; font-weight: 600; font-size: 13px; line-height: 20px; color: #0F171F; }
    .clarif-input-row { display: flex; gap: 8px; }
    .clarif-input-row input {
      flex: 1;
      min-width: 0;
      border: 1px solid #cfd8e7;
      border-radius: 6px;
      height: 32px;
      padding: 0 10px;
      font-size: 13px;
      outline: none;
    }
    .clarif-input-row input:focus { border-color: #005EB8; box-shadow: 0 0 0 2px rgba(0,94,184,0.12); }
    .clarif-next-btn {
      border: 1px solid #005EB8;
      background: #fff;
      border-radius: 6px;
      height: 32px;
      padding: 0 14px;
      font-weight: 600;
      font-size: 13px;
      color: #005EB8;
      cursor: pointer;
      flex-shrink: 0;
    }
    .clarif-next-btn:hover { background: #e8f0fb; }

    .clarif-sources {
      border: none;
      background: transparent;
      color: #005EB8;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      padding: 2px 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .clarif-sources svg { transition: transform 200ms ease; }
    .clarif-sources.open svg { transform: rotate(180deg); }

    .sources-list { display: grid; gap: 4px; font-size: 13px; }
    .sources-list a { color: #1a56db; text-decoration: none; }
    .sources-list a:hover { text-decoration: underline; }

    .clarif-answered-row { display: flex; flex-direction: column; gap: 2px; padding: 6px 0; border-bottom: 1px solid #e2e8f2; }
    .clarif-answered-row:last-of-type { border-bottom: none; }
    .clarif-answered-q { font: 600 12px/16px 'Open Sans', sans-serif; color: #485c78; }
    .clarif-answered-a { font: 400 13px/18px 'Open Sans', sans-serif; color: #0f171f; background: #f4f7fb; border-radius: 4px; padding: 4px 8px; }
    .clarif-done-header { display: flex; align-items: center; gap: 6px; font: 600 13px/18px 'Open Sans', sans-serif; color: #1a7f4b; }

    .view-clarif {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: none;
      border-top: 1px solid #e2e8f2;
      background: transparent;
      color: #005EB8;
      padding: 8px 2px 0;
      margin-top: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      gap: 6px;
    }
    .view-clarif:hover { color: #003d7a; }
    .view-clarif .view-clarif-label { display: flex; align-items: center; gap: 6px; }
    .view-clarif .view-clarif-chevron { transition: transform 200ms ease; }
    .view-clarif.open .view-clarif-chevron { transform: rotate(180deg); }

    /* ── Animations ── */
    @keyframes typing-dot {
      0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
      40%           { opacity: 1;    transform: translateY(-3px); }
    }
    .lc-typing-bubble {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px 10px;
      background: #EDEFF7;
      border-radius: 2px 8px 8px 8px;
      width: fit-content;
    }
    .lc-typing-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #637084;
      animation: typing-dot 1s infinite ease-in-out;
    }
    .lc-typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .lc-typing-dot:nth-child(3) { animation-delay: 0.30s; }

    @keyframes ai-dot-pulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40%           { opacity: 1;    transform: scale(1); }
    }
    @keyframes ai-fade-in {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .ai-thinking {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px 0 6px;
      font-size: 12px;
      color: #005EB8;
      font-style: italic;
    }
    .ai-thinking-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #005EB8;
      animation: ai-dot-pulse 1.2s infinite ease-in-out;
    }
    .ai-thinking-dot:nth-child(2) { animation-delay: 0.2s; }
    .ai-thinking-dot:nth-child(3) { animation-delay: 0.4s; }
    .ai-updated { animation: ai-fade-in 0.45s ease; }

    /* ── Toast ── */
    .toast-stack {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      gap: 8px;
      z-index: 100;
      pointer-events: none;
    }
    .toast {
      background: #1f232a;
      color: #fff;
      font-size: 13px;
      padding: 9px 14px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
      animation: ai-fade-in 0.25s ease;
      text-align: center;
    }

    @media (max-width: 980px) {
      .topbar-right { display: none; }
      .main { padding-left: 8px; padding-right: 8px; overflow: auto; }
      .page { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; }
      .page-top-row { grid-template-columns: 1fr; row-gap: 6px; }
      .panels-bar { grid-template-columns: 1fr; row-gap: 6px; padding: 8px 0; }
      .panel { grid-row: auto; min-height: 480px; }
      .panel + .panel { border-top: 1px solid var(--line); }
    }

    @media (max-width: 700px) {
      .shell { grid-template-columns: var(--desk-collapsed) 1fr; }
      .shell .status-pill,
      .shell .desk .call-card-body,
      .shell .desk .live-chat-panel { display: none; }
      .shell .desk .call-card { padding: 10px 8px; min-height: 44px; display: grid; place-items: center; }
      .shell .desk .call-icon { width: 30px; height: 30px; }
      .search { width: min(200px, 30vw); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"><span class="logo-fallback" aria-hidden="true"></span></div>
      <div>Agent Desk</div>
    </div>
    <input class="search" type="text" placeholder="Search" aria-label="Search" />
    <div class="topbar-right" aria-label="Top bar actions">
      <span style="opacity:0.85; font-size:13px;">Link ↗</span>
      <button class="top-icon" id="notifBtn" type="button" title="Notifications" aria-label="Notifications">
        <svg class="cs-icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 12H2C1.61 12 1.37 11.56 1.59 11.24L4 8V5C4 2.79 5.79 1 8 1C10.21 1 12 2.79 12 5V8L14.41 11.24C14.63 11.57 14.39 12 14 12Z" class="stroke-linejoin-round"/>
          <path d="M6 13C6 14.1 6.9 15 8 15C9.1 15 10 14.1 10 13" class="stroke-linejoin-round"/>
        </svg>
        <span class="dot"></span>

  const fmt = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  const nowTime = () => new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    $('toastStack').appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    }
    fallbackCopy(text);
    return Promise.resolve();
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* ignore */ }
    ta.remove();
  }

  /* ════════════════════════════════════════════════════════════════
     Scheduling per contact (so timers stop if the chat ends)
     ════════════════════════════════════════════════════════════════ */
  function schedule(id, ms, fn) {
    const c = contacts[id];
    const t = setTimeout(() => {
      c.timeouts = c.timeouts.filter(x => x !== t);
      fn();
    }, ms);
    c.timeouts.push(t);
  }

  /* ════════════════════════════════════════════════════════════════
     Agent Desk queue
     ════════════════════════════════════════════════════════════════ */
  function renderQueue() {
    const q = $('deskQueue');
    if (!order.length) {
      q.innerHTML = '<div class="queue-empty">No active contacts</div>';
      return;
    }
    q.innerHTML = order.map(id => {
      const c = contacts[id];
      const selected = id === activeId && c.status !== 'incoming';
      const cls = ['call-card'];
      if (c.status === 'connected' || c.status === 'ended') cls.push('active');
      if (c.status === 'incoming') cls.push('incoming');
      if (c.status === 'ended') cls.push('ended');
      if (selected) cls.push('selected');
      const iconCls = c.status === 'incoming' ? 'chat-incoming' : selected ? 'chat-selected' : 'chat-active';
      const label = c.status === 'incoming' ? 'Incoming Chat' : c.status === 'ended' ? 'Chat ended' : 'Connected Chat';
      const badge = (!selected && c.unread) ? `<span class="unread-badge">${c.unread}</span>` : '';
      const actions = c.status === 'incoming'
        ? `<div class="incoming-actions"><button class="btn-accept" type="button" data-accept="${id}">Accept</button><button class="btn-decline" type="button" data-decline="${id}">Decline</button></div>`
        : '';
      return `<article class="${cls.join(' ')}" data-contact="${id}">
        <span class="call-icon ${iconCls}" aria-hidden="true">${CHAT_ICON}</span>
        <div class="call-card-body">
          <div class="name">${esc(c.name)}</div>
          <div class="meta"><span>${label}</span><span id="timer-${id}">${fmt(c.seconds)}</span></div>
          ${actions}
        </div>
        ${badge}
      </article>`;
    }).join('');
  }

  $('deskQueue').addEventListener('click', (e) => {
    const accept = e.target.closest('[data-accept]');
    if (accept) { acceptContact(accept.dataset.accept); return; }
    const decline = e.target.closest('[data-decline]');
    if (decline) { declineContact(decline.dataset.decline); return; }
    const card = e.target.closest('.call-card');
    if (!card) return;
    const c = contacts[card.dataset.contact];
    if (c.status === 'incoming') {
      if (shell.classList.contains('collapsed')) toggleBtn.click();
      return;
    }
    selectContact(c.id);
  });

  function declineContact(id) {

  function messageHTML(c, m, isNew) {
    if (m.role === 'system') return `<div class="lc-system">${esc(m.text)}</div>`;
    const isCustomer = m.role === 'customer';
    const dir = isCustomer ? 'incoming' : 'outgoing';
    const initials = isCustomer ? c.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase() : AGENT.initials;
    const sender = isCustomer ? c.first : `${AGENT.name} (you)`;
    const receipt = isCustomer ? '' : `<div class="lc-read-receipt"><svg width="13" height="10" viewBox="0 0 16 12" fill="none"><path d="M1 6l4 4L15 1" stroke="#5f6b7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 6l4 4" stroke="#5f6b7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Read</div>`;
    return `<div class="lc-bubble-row ${dir}${isNew ? ' new' : ''}">
      <div class="lc-meta"><div class="lc-avatar ${dir}">${initials}</div><span class="lc-sender">${esc(sender)}</span><span class="lc-time">${m.time}</span></div>
      <div class="lc-bubble ${isCustomer ? 'from-customer' : 'from-agent'}">${esc(m.text)}</div>${receipt}
    </div>`;
  }

  function renderLiveChat() {
    const c = contacts[activeId];
    const msgs = $('liveChatMsgs');
    const input = $('liveChatInput');
    const endBtn = $('endChatBtn');
    const strip = $('activeStrip');

    if (!c) {
      $('activeStripName').textContent = 'No contact selected';
      $('activeStripSub').textContent = 'Waiting for chats';
      $('liveChatTimer').textContent = '';
      strip.classList.add('ended');
      msgs.innerHTML = `<div class="live-chat-empty">${agentStatus === 'available' ? 'You\'re available. New chats will appear above.' : 'Set your status to Available to receive chats.'}</div>`;
      input.disabled = true;
      $('lcSendBtn').disabled = true;
      endBtn.style.display = 'none';
      return;
    }

    const ended = c.status === 'ended';
    $('activeStripName').textContent = c.name;
    $('activeStripSub').textContent = ended ? 'Chat ended · After contact work' : 'Connected Chat';
    $('liveChatTimer').textContent = fmt(c.seconds);
    strip.classList.toggle('ended', ended);

    let html = c.messages.map((m, i) => messageHTML(c, m, i >= c.rendered)).join('');
    c.rendered = c.messages.length;
    if (c.typing) {
      html += `<div class="lc-bubble-row incoming"><div class="lc-meta"><span class="lc-sender">${esc(c.first)} is typing</span></div>
        <div class="lc-typing-bubble"><div class="lc-typing-dot"></div><div class="lc-typing-dot"></div><div class="lc-typing-dot"></div></div></div>`;
    }
    msgs.innerHTML = html;
    msgs.scrollTop = msgs.scrollHeight;

    input.disabled = ended;
    $('lcSendBtn').disabled = ended;
    input.placeholder = ended ? 'This chat has ended' : 'Type a message…';
    endBtn.style.display = '';
    endBtn.textContent = ended ? 'Close Contact' : 'End Chat';
    endBtn.classList.toggle('close', ended);
  }

  function addMessage(id, msg) {
    const c = contacts[id];
    c.messages.push({ ...msg, time: nowTime() });
    if (id === activeId) {
      renderLiveChat();
    } else if (msg.role === 'customer') {
      c.unread++;
      renderQueue();
    }
    if (msg.role === 'customer') updateAi(id);
  }

  function startChat(id) {
    const c = contacts[id];
    c.started = true;
    const text = openingMessages[id];
    c.typing = true;
    if (id === activeId) renderLiveChat();
    schedule(id, 1200 + Math.min(text.length * 12, 1400), () => {
      c.typing = false;
      addMessage(id, { role: 'customer', text });
    });
  }

  function pickCustomerReply(id, agentText) {
    const c = contacts[id];
    const stages = customerReplies[id];
    if (!stages || c.replyStage >= stages.length) return null;
    for (let i = c.replyStage; i < stages.length; i++) {
      if (stages[i].match.test(agentText)) {
        c.replyStage = i + 1;
        return stages[i].text;
      }
    }
    const text = stages[c.replyStage].text;
    c.replyStage++;
    return text;
  }

  function triggerCustomerReply(id, agentText) {
    const c = contacts[id];
    const reply = pickCustomerReply(id, agentText);
    if (!reply) return;
    schedule(id, 700, () => {
      c.typing = true;
      if (id === activeId) renderLiveChat();
    });
    schedule(id, 700 + 900 + Math.min(reply.length * 15, 1500), () => {
      c.typing = false;
      addMessage(id, { role: 'customer', text: reply });
    });
  }

  function sendLiveMessage() {
    const input = $('liveChatInput');
    const text = input.value.trim();
    const c = contacts[activeId];
    if (!text || !c || c.status !== 'connected') return;
    input.value = '';
    addMessage(c.id, { role: 'agent', text });
    triggerCustomerReply(c.id, text);
  }

  function insertIntoChat(text) {
    const c = contacts[activeId];
    if (!c || c.status !== 'connected') { toast('Select a connected chat first'); return; }
    const input = $('liveChatInput');
    input.value = text;
    input.focus();
    input.setSelectionRange(text.length, text.length);
    if (shell.classList.contains('collapsed')) toggleBtn.click();
    toast('Added to the chat box — press Enter to send');
  }

  $('lcSendBtn').addEventListener('click', sendLiveMessage);
  $('liveChatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendLiveMessage(); }
  });

  $('endChatBtn').addEventListener('click', () => {
    const c = contacts[activeId];
    if (!c) return;
    if (c.status === 'connected') {
      c.timeouts.forEach(clearTimeout);
      c.timeouts = [];
      c.typing = false;
      c.status = 'ended';
      c.messages.push({ role: 'system', text: `Chat ended by ${AGENT.name} · ${nowTime()}`, time: nowTime() });
      renderQueue();
      renderLiveChat();
      toast(`Chat with ${c.name} ended`);
    } else {
      order = order.filter(x => x !== c.id);
      const next = order.find(x => contacts[x].status === 'connected') || order.find(x => contacts[x].status === 'ended') || null;
      activeId = next;
      $('liveChatInput').value = next ? contacts[next].draft : '';
      if (next) contacts[next].unread = 0;
      renderAll();
      resetIqa();
      toast(`Contact with ${c.name} closed`);
    }
  });

      renderPriorSummary();
    } else if (e.target.closest('[data-open-history]')) {
      $('tabHistory').click();
    }
  });

  /* ════════════════════════════════════════════════════════════════
     AI Assistant: suggested next best response
     ════════════════════════════════════════════════════════════════ */
  function pickAiIndex(id) {
    const c = contacts[id];
    const rules = stageRules[id] || [];
    const full = c.messages.filter(m => m.role === 'customer').map(m => m.text.toLowerCase()).join(' ');
    for (let i = rules.length - 1; i >= 1; i--) {
      if (rules[i] && rules[i].test(full) && !c.aiShown.has(i)) return i;
    }
    if (!c.aiShown.has(0)) return 0;
    return c.aiIndex;
  }

  function updateAi(id) {
    const c = contacts[id];
    const next = pickAiIndex(id);
    if (next === c.aiIndex) return;
    c.aiIndex = next;
    c.aiShown.add(next);
    c.aiThinking = true;
    if (id === activeId) renderSuggestions();
    setTimeout(() => {
      c.aiThinking = false;
      if (id === activeId) renderSuggestions(true);
    }, 1400);
  }

  function personalize(text) {
    const c = contacts[activeId];
    return text.replace(/\{name\}/g, c ? c.first : 'there');
  }

  function renderSuggestions(animate) {
    const el = $('suggestionCard');
    const c = contacts[activeId];
    if (!c) { el.innerHTML = '<div class="sugg-placeholder">No active contact.</div>'; return; }
    if (c.aiThinking) { el.innerHTML = thinkingHTML(); return; }
    if (c.aiIndex === null) {
      el.innerHTML = '<div class="sugg-placeholder">Suggestions will appear once the customer sends a message.</div>';
      return;
    }
    const data = aiData[c.id][c.aiIndex];
    const cards = [{ suggTitle: data.suggTitle, suggText: data.suggText }, ...(data.alts || [])];
    const links = (HELPFUL_LINKS[c.id] || [])[c.aiIndex] || [];
    el.innerHTML = cards.map((card, i) => `
      <div class="suggestion-card${i === 0 ? ' primary' : ''}${i === 0 && animate ? ' ai-updated' : ''}" data-sugg="${i}">
        <div class="suggestion-title-row">
          <button class="suggestion-title-label" type="button" data-toggle-sugg aria-expanded="true">
            <img src="${CHEVRON_DOWN}" alt="" aria-hidden="true"/>
            ${esc(card.suggTitle)}
            ${i === 0 ? '<span class="best-tag">Best match</span>' : ''}
          </button>
          <div class="sugg-actions">
            <button class="copy-btn" type="button" data-copy-sugg>Copy</button>
            <button class="copy-btn" type="button" data-use-sugg>Use</button>
            <button class="copy-btn subtle" type="button" data-nothelpful aria-expanded="false">Not helpful?</button>
          </div>
        </div>
        <div class="sugg-feedback" hidden>
          <span>What was wrong?</span>
          ${FEEDBACK_REASONS.map(r => `<button type="button" class="reason-chip" data-reason>${r}</button>`).join('')}
        </div>
        <div class="suggestion-body">
          <div class="suggestion-text-shell">
            <div class="suggestion-text-wrap"><p class="suggestion-text">${esc(card.suggText)}</p></div>
            <div class="text-fade"></div>
          </div>
          <span class="helpful-links-label">Helpful Links · examples</span>
          <div class="link-chips">${links.map(l => `<span class="link-chip" tabindex="0" title="Example document made up for this prototype. Not a real source.">${esc(l)}</span>`).join('')}</div>
        </div>
      </div>`).join('');
    el._cards = cards;
    bindScrollFades(el);
  }

  $('suggestionCard').addEventListener('click', (e) => {
    const el = $('suggestionCard');
    const cardEl = e.target.closest('.suggestion-card');
    if (!cardEl) return;
    const card = el._cards[Number(cardEl.dataset.sugg)];
    if (e.target.closest('[data-toggle-sugg]')) {
      const collapsed = cardEl.classList.toggle('collapsed');
      e.target.closest('[data-toggle-sugg]').setAttribute('aria-expanded', String(!collapsed));
      updateScrollFades(el);
    } else if (e.target.closest('[data-copy-sugg]')) {
      const btn = e.target.closest('[data-copy-sugg]');
      copyText(card.suggText);
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
    } else if (e.target.closest('[data-use-sugg]')) {
      insertIntoChat(card.suggText);
    } else if (e.target.closest('[data-nothelpful]')) {
      const btn = e.target.closest('[data-nothelpful]');
      const fb = cardEl.querySelector('.sugg-feedback');
      fb.hidden = !fb.hidden;
      btn.setAttribute('aria-expanded', String(!fb.hidden));
    } else if (e.target.closest('[data-reason]')) {
      /* Front-end only: the choice is not stored or sent anywhere */
      cardEl.querySelector('.sugg-feedback').innerHTML = '<span class="sugg-feedback-done">Thanks, noted</span>';
      cardEl.querySelector('[data-nothelpful]').remove();
      cardEl.classList.add('collapsed');
      cardEl.querySelector('[data-toggle-sugg]').setAttribute('aria-expanded', 'false');
    }
  });

  /* ── Scroll fades (suggestion + IQA text areas) ── */
  function syncFade(shellEl) {
    const wrap = shellEl.querySelector('.suggestion-text-wrap, .iqa-text-wrap');
    const fade = shellEl.querySelector('.text-fade');
    if (!wrap || !fade) return;
    const overflow = wrap.scrollHeight - wrap.clientHeight > 1;
    const atBottom = wrap.scrollTop + wrap.clientHeight >= wrap.scrollHeight - 2;
    shellEl.classList.toggle('has-overflow', overflow);
    fade.classList.toggle('hidden', !overflow || atBottom);
  }

  function bindScrollFades(root) {
    root.querySelectorAll('.suggestion-text-shell, .iqa-text-shell').forEach(shellEl => {
      const wrap = shellEl.querySelector('.suggestion-text-wrap, .iqa-text-wrap');
      if (wrap) wrap.addEventListener('scroll', () => syncFade(shellEl));
      syncFade(shellEl);
    });
  }

  function updateScrollFades(root) {
    (root || document).querySelectorAll('.suggestion-text-shell, .iqa-text-shell').forEach(syncFade);
  }

  function toggleAccordion(btn) {
    const expanded = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!expanded));
    btn.nextElementSibling.classList.toggle('collapsed', expanded);
    requestAnimationFrame(() => updateScrollFades());
  }

  /* ════════════════════════════════════════════════════════════════
     Responses tab
     ════════════════════════════════════════════════════════════════ */
  const openResp = new Set();
  let respFilter = 'all';
  let respQuery = '';

  function findRespItem(id) {
    for (const cat of RESPONSES) for (const it of cat.items) if (it.id === id) return it;
    return null;
  }

  function renderResponses() {
    const list = $('respList');
    const q = respQuery.trim().toLowerCase();
    let html = '';
    RESPONSES.forEach(cat => {
      if (respFilter !== 'all' && cat.tag !== respFilter) return;
      const items = cat.items.map(it => {
        const msgs = it.messages.map((m, idx) => ({ text: personalize(m), idx }));
        if (!q) return { it, msgs };
        const titleHit = it.title.toLowerCase().includes(q);
        const hits = titleHit ? msgs : msgs.filter(m => m.text.toLowerCase().includes(q));
        return (titleHit || hits.length) ? { it, msgs: hits } : null;
      }).filter(Boolean);
      if (!items.length) return;
      html += `<div class="resp-category-header"><span class="cat-title" title="${esc(cat.category)}">${esc(cat.category)}</span></div>`;
      items.forEach(({ it, msgs }) => {
        const open = q ? true : openResp.has(it.id);
        html += `<div class="resp-item${open ? ' open' : ''}" data-resp="${it.id}" role="button" tabindex="0" aria-expanded="${open}">
          <div class="resp-item-left">
            <div class="resp-item-icon ${it.icon}"><img src="${ICONS[it.icon]}" alt="" width="28" height="28"></div>
            <div class="resp-item-text">
              <div class="resp-item-title">${esc(it.title)}</div>
              ${it.sub ? `<div class="resp-item-sub">${esc(it.sub)}</div>` : ''}
            </div>
          </div>
          <div class="resp-item-right">
            <span class="resp-item-count">${msgs.length}</span>
            <span class="resp-item-chevron"><img src="${CHEVRON_RIGHT}" alt="" style="width:12px;height:12px;display:block"></span>
          </div>
        </div>
        <div class="resp-expand-panel${open ? ' open' : ''}">
          ${msgs.map(m => `<div class="resp-expand-row" data-resp="${it.id}" data-idx="${m.idx}">
            <div class="resp-expand-row-inner">
              <span class="resp-expand-text" title="Click to add to the chat">${esc(m.text)}</span>
              <div class="resp-row-actions">
                <button class="resp-use-btn" type="button" data-use>Use</button>
                <button class="resp-copy-btn" type="button" title="Copy" data-copy>${COPY_SVG}</button>
              </div>
            </div>
          </div>`).join('')}
        </div>`;
      });
    });
    list.innerHTML = html || `<div class="resp-empty">No responses match "${esc(respQuery)}"</div>`;
    initShowMore(list);
  }

  function initShowMore(root) {
    requestAnimationFrame(() => {
      root.querySelectorAll('.resp-expand-panel.open .resp-expand-text').forEach(el => {
        const row = el.closest('.resp-expand-row');
        if (row.querySelector('.resp-show-more')) return;
        if (el.scrollHeight > el.clientHeight + 2) {
          const btn = document.createElement('button');
          btn.className = 'resp-show-more';
          btn.type = 'button';
          btn.textContent = 'Show more';
          row.appendChild(btn);
        }
      });
    });
  }

  function respTextFor(row) {
    const it = findRespItem(row.dataset.resp);
    return personalize(it.messages[Number(row.dataset.idx)]);
  }

  $('respList').addEventListener('click', (e) => {
    const row = e.target.closest('.resp-expand-row');
    if (row) {
      if (e.target.closest('[data-copy]')) {
        const btn = e.target.closest('[data-copy]');
        copyText(respTextFor(row));
        btn.style.opacity = '0.4';
        setTimeout(() => { btn.style.opacity = ''; }, 800);
        toast('Copied to clipboard');
      } else if (e.target.closest('.resp-show-more')) {
        const btn = e.target.closest('.resp-show-more');
        const expanded = row.querySelector('.resp-expand-text').classList.toggle('expanded');
        btn.textContent = expanded ? 'Show less' : 'Show more';
      } else if (e.target.closest('[data-use]') || e.target.closest('.resp-expand-text')) {
        insertIntoChat(respTextFor(row));
      }
      return;
    }
    const item = e.target.closest('.resp-item');
    if (item) toggleRespItem(item);
  });

  $('respList').addEventListener('keydown', (e) => {
    const item = e.target.closest('.resp-item');
    if (item && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleRespItem(item); }
  });

  function toggleRespItem(item) {
    const id = item.dataset.resp;
    const panel = item.nextElementSibling;
    const open = panel.classList.toggle('open');
    item.classList.toggle('open', open);
    item.setAttribute('aria-expanded', String(open));
    if (open) openResp.add(id); else openResp.delete(id);
    if (open) initShowMore(panel.parentElement);
  }

  $('respSearch').addEventListener('input', (e) => {
    respQuery = e.target.value;
    $('respSearchBox').classList.toggle('has-value', !!respQuery);
    renderResponses();
  });

  $('respSearchClear').addEventListener('click', () => {
    $('respSearch').value = '';
    respQuery = '';
    $('respSearchBox').classList.remove('has-value');
    renderResponses();
    $('respSearch').focus();
  });

  $('respFilters').addEventListener('click', (e) => {
    const pill = e.target.closest('.resp-filter-pill');
    if (!pill) return;
    respFilter = pill.dataset.filter;
    document.querySelectorAll('.resp-filter-pill').forEach(p => p.classList.toggle('active', p === pill));
    renderResponses();
  });

  /* ════════════════════════════════════════════════════════════════
     History tab
     ════════════════════════════════════════════════════════════════ */
  function renderHistory() {
    const el = $('panelHistory');
    const c = contacts[activeId];
    if (!c) { el.innerHTML = '<div class="sugg-placeholder">No contact selected.</div>'; return; }
    el.innerHTML = `<div style="font-size:13px; color:var(--muted);">Previous contacts with <strong style="color:var(--text)">${esc(c.name)}</strong></div>` +
      profiles[c.id].history.map(h => `<div class="history-card">
        <h4>${esc(h.title)}</h4>
        <p>${esc(h.text)}</p>
        <span class="history-tag">${esc(h.tag)}</span>
      </div>`).join('');
  }

  const mainTabs = [
    { btn: $('tabResponses'), panel: $('panelResponses') },
    { btn: $('tabHistory'),   panel: $('panelHistory') }
  ];
  mainTabs.forEach(({ btn, panel }) => {
    btn.addEventListener('click', () => {
      mainTabs.forEach(({ btn: b, panel: p }) => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
        p.style.display = 'none';
      });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      panel.style.display = 'flex';
    });
  });

  /* ════════════════════════════════════════════════════════════════
     Assist Q&amp;A
     ════════════════════════════════════════════════════════════════ */
  let iqaToken = 0;

  const quickQuestions = {
    nina: ['What is the dispute window for a donation?', 'How long until provisional credit?'],
    jo:  ['What does BRMBL*MKTPLACE mean?', 'How do I file an unrecognised charge?'],
    sam:   ['Why was the card frozen?', 'How do I add a travel notice?']
  };

  function renderIqaQuick() {
    const el = $('iqaQuick');
    const c = contacts[activeId];
    el.innerHTML = c ? quickQuestions[c.id].map(q => `<button type="button">${esc(q)}</button>`).join('') : '';
  }

  $('iqaQuick').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    $('iqaInput').value = b.textContent;
    submitIqaQuestion();
  });

  function resetIqa() {
    iqaToken++;
    $('iqaBlock').innerHTML = '<div class="sugg-placeholder">Ask Assist a question about this contact — answers use the policies relevant to the conversation.</div>';
    $('iqaClarifCard').style.display = 'none';
    $('iqaClarifCard').innerHTML = '';
    $('iqaClarifSources').style.display = 'none';
    $('iqaSourcesList').style.display = 'none';
  }

  function expandIqa() {
    const btn = $('iqaAccordionBtn');
    if (btn.getAttribute('aria-expanded') === 'false') toggleAccordion(btn);
  }

  $('iqaNewBtn').addEventListener('click', () => { resetIqa(); $('iqaInput').value = ''; $('iqaInput').focus(); });
  $('iqaSendBtn').addEventListener('click', submitIqaQuestion);
  $('iqaInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitIqaQuestion(); }
  });

  function submitIqaQuestion() {
    const input = $('iqaInput');
    const question = input.value.trim();
    if (!question) return;
    const c = contacts[activeId];
    if (!c) { toast('Select a contact first'); return; }
    input.value = '';

    const dataset = aiData[c.id];
    const currentIdx = c.aiIndex === null ? 0 : c.aiIndex;
    let data = dataset[currentIdx];
    if (!data.clarif) {
      for (let i = currentIdx - 1; i >= 0; i--) {
        if (dataset[i].clarif) { data = { ...dataset[currentIdx], clarif: dataset[i].clarif }; break; }
      }
    }

    const token = ++iqaToken;
    const iqaBlock = $('iqaBlock');
    const clarifCard = $('iqaClarifCard');
    const clarifSources = $('iqaClarifSources');
    const sourcesList = $('iqaSourcesList');

    expandIqa();
    clarifCard.style.display = 'none';
    clarifCard.innerHTML = '';
    clarifSources.style.display = 'none';
    sourcesList.style.display = 'none';

    const questionHTML = `<div class="iqa-question">${esc(question)}</div>`;
    iqaBlock.innerHTML = questionHTML + thinkingHTML();

    setTimeout(() => {
      if (token !== iqaToken) return;
      iqaBlock.innerHTML = questionHTML + `
        <div class="iqa-header">
          <div class="feedback-btns">
            <button class="feedback-btn" type="button" title="Helpful" aria-label="Thumbs up" data-fb="up">
              <svg class="cs-icon" viewBox="0 0 16 16"><path class="stroke-linejoin-round" d="M9 2.87V7H13.12C13.72 7 14.14 7.59 13.95 8.16L12.35 12.93C12.13 13.57 11.53 14 10.86 14H1V6H5L7.41 2.39C7.89 1.67 9 2.01 9 2.87Z"/><path class="stroke-linejoin-round" d="M5 14V6"/></svg>
            </button>
            <button class="feedback-btn" type="button" title="Not helpful" aria-label="Thumbs down" data-fb="down">
              <svg class="cs-icon" viewBox="0 0 16 16"><path class="stroke-linejoin-round" d="M9 13.13V9H13.12C13.72 9 14.14 8.41 13.95 7.84L12.35 3.07C12.13 2.43 11.53 2 10.86 2H1V10H5L7.41 13.61C7.89 14.33 9 13.99 9 13.13Z"/><path class="stroke-linejoin-round" d="M5 2V10"/></svg>
            </button>
          </div>
          <strong>Answer</strong>
          <span class="ai-badge"><img src="${AI_SPARKLE}" alt="" aria-hidden="true"/>AI Generated</span>
        </div>
        <div class="iqa-text-shell">
          <div class="iqa-text-wrap ai-updated"><p>${esc(data.iqaAnswer)}</p></div>
          <div class="text-fade"></div>
        </div>`;

      iqaBlock.querySelectorAll('[data-fb]').forEach(btn => {
        btn.addEventListener('click', () => {
          const up = btn.dataset.fb === 'up';
          const other = iqaBlock.querySelector(`[data-fb="${up ? 'down' : 'up'}"]`);
          const on = btn.classList.toggle(up ? 'active-up' : 'active-down');
          other.classList.remove('active-up', 'active-down');
          if (on) toast(up ? 'Thanks — marked as helpful' : 'Thanks — we\'ll use this to improve answers');
        });
      });

      bindScrollFades(iqaBlock);
      if (!data.clarif) return;

      /* View clarification toggle */
      const viewBtn = document.createElement('button');
      viewBtn.type = 'button';
      viewBtn.className = 'view-clarif open';
      viewBtn.innerHTML = `<span class="view-clarif-label"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#005EB8" stroke-width="1.5"/><path d="M8 5V8.5" stroke="#005EB8" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11" r="0.75" fill="#005EB8"/></svg>View Clarification</span>
        <svg class="view-clarif-chevron" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 6L8 10L12 6" stroke="#005EB8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      viewBtn.addEventListener('click', () => {
        const showing = clarifCard.style.display !== 'none';
        clarifCard.style.display = showing ? 'none' : 'flex';
        clarifSources.style.display = showing ? 'none' : 'flex';
        if (showing) { sourcesList.style.display = 'none'; clarifSources.classList.remove('open'); }
        viewBtn.classList.toggle('open', !showing);
      });
      iqaBlock.appendChild(viewBtn);

      /* Clarification steps */
      const questions = data.clarif.questions;
      const answers = [];

      const answeredHTML = () => answers.map((a, i) => `<div class="clarif-answered-row">
        <span class="clarif-answered-q">${esc(questions[i])}</span>
        <span class="clarif-answered-a">${esc(a)}</span></div>`).join('');

      function renderStep() {
        const n = answers.length;
        clarifCard.innerHTML = `
          <div class="clarif-header">
            <div class="clarif-title">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#005EB8" stroke-width="1.5"/><path d="M8 5V8.5" stroke="#005EB8" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11" r="0.75" fill="#005EB8"/></svg>
              Clarification Needed
              <span style="margin-left:auto;margin-right:8px;font:400 11px/16px 'Open Sans',sans-serif;color:#485c78">${n + 1} of ${questions.length}</span>
            </div>
            <button class="clarif-close" type="button" aria-label="Dismiss">&times;</button>
          </div>
          ${answeredHTML()}
          <div class="clarif-q">${n + 1}. ${esc(questions[n])}</div>
          <div class="clarif-input-row">
            <input type="text" placeholder="Type your answer here…" aria-label="Clarification answer"/>
            <button class="clarif-next-btn" type="button">${n < questions.length - 1 ? 'Next' : 'Done'}</button>
          </div>`;
        const cinput = clarifCard.querySelector('input');
        const submit = () => {
          const val = cinput.value.trim();
          if (!val) { cinput.focus(); return; }
          answers.push(val);
          if (answers.length >= questions.length) renderDone(); else renderStep();
        };
        clarifCard.querySelector('.clarif-next-btn').addEventListener('click', submit);
        cinput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
        clarifCard.querySelector('.clarif-close').addEventListener('click', () => viewBtn.click());
        cinput.focus();
      }

      function renderDone() {
        clarifCard.innerHTML = `<div class="clarif-done-header">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#1a7f4b" stroke-width="1.5"/><path d="M5 8l2 2 4-4" stroke="#1a7f4b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Clarifications captured
          </div>${answeredHTML()}`;
        clarifCard.style.display = 'none';
        clarifSources.style.display = 'none';
        sourcesList.style.display = 'none';
        viewBtn.classList.remove('open');
        viewBtn.querySelector('.view-clarif-label').innerHTML = `<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#1a7f4b" stroke-width="1.5"/><path d="M5 8l2 2 4-4" stroke="#1a7f4b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>View Clarification`;

        const wrap = iqaBlock.querySelector('.iqa-text-wrap');
        if (!wrap) return;
        wrap.classList.remove('ai-updated');
        wrap.innerHTML = thinkingHTML();
        setTimeout(() => {
          if (token !== iqaToken) return;
          wrap.innerHTML = `<p><strong style="color:#1a7f4b">Refined answer · </strong>${esc(data.clarif.refinedAnswer)}</p>`;
          void wrap.offsetWidth;
          wrap.classList.add('ai-updated');
          updateScrollFades(iqaBlock);
        }, 1200);
      }

      renderStep();
      clarifCard.style.display = 'flex';
      clarifCard.classList.add('ai-updated');

      const sources = data.clarif.sources;
      clarifSources.innerHTML = `<svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M4 6L8 10L12 6" stroke="#005EB8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Sources (${sources.length})`;
      clarifSources.style.display = 'flex';
      clarifSources.classList.remove('open');
      clarifSources.onclick = () => {
        const open = sourcesList.style.display === 'none';
        sourcesList.style.display = open ? 'grid' : 'none';
        clarifSources.classList.toggle('open', open);
      };
      sourcesList.innerHTML = sources.map(s => `<a href="#" onclick="event.preventDefault(); toast('Example document, not a real source: ${esc(s).replace(/'/g, '&#39;')}')">${esc(s)}</a>`).join('');
    }, 1400);
  }

  /* ════════════════════════════════════════════════════════════════
     Agent status
     ════════════════════════════════════════════════════════════════ */
  const STATUS_LABELS = { available: 'Available', break: 'Break', offline: 'Offline' };

  function renderStatus() {
    const pill = $('statusPill');
    pill.className = 'status-pill' + (agentStatus === 'available' ? '' : ' ' + agentStatus);
    pill.innerHTML = `${STATUS_ICON} ${STATUS_LABELS[agentStatus]} <span class="caret">▾</span>`;
  }

  $('statusPill').addEventListener('click', (e) => {
    e.stopPropagation();
    const menu = $('statusMenu');
    const open = menu.classList.toggle('open');
    $('statusPill').setAttribute('aria-expanded', String(open));
  });

  $('statusMenu').addEventListener('click', (e) => {
    const opt = e.target.closest('.status-option');
    if (!opt) return;
    agentStatus = opt.dataset.status;
    $('statusMenu').classList.remove('open');
    renderStatus();
    if (!activeId) renderLiveChat();
    toast(`Status set to ${STATUS_LABELS[agentStatus]}`);
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#statusMenu')) $('statusMenu').classList.remove('open');
  });

  $('notifBtn').addEventListener('click', () => {
    const incoming = order.find(id => contacts[id].status === 'incoming');
    toast(incoming ? `${contacts[incoming].name} is waiting — accept in the Agent Desk panel` : 'No new notifications');
  });

  /* ════════════════════════════════════════════════════════════════
     Agent Desk panel collapse / resize
     ════════════════════════════════════════════════════════════════ */
  const shell = $('shell');
  const toggleBtn = $('toggleBtn');
  const deskResizer = $('deskResizer');
  const minWidth = 210;
  const maxWidth = 460;
  let lastExpandedWidth = 270;
  let isDragging = false;

  toggleBtn.addEventListener('click', () => {
    const collapsed = shell.classList.toggle('collapsed');
    if (!collapsed) shell.style.setProperty('--desk-width', `${lastExpandedWidth}px`);
    toggleBtn.setAttribute('aria-expanded', String(!collapsed));
  });

  deskResizer.addEventListener('mousedown', (e) => {
    if (shell.classList.contains('collapsed')) return;
    isDragging = true;
    deskResizer.classList.add('dragging');
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const w = Math.min(Math.max(e.clientX, minWidth), maxWidth);
    lastExpandedWidth = w;
    shell.style.setProperty('--desk-width', `${w}px`);
  });

  window.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;
    deskResizer.classList.remove('dragging');
    document.body.style.userSelect = '';
  });

  window.addEventListener('resize', () => updateScrollFades());

  /* ════════════════════════════════════════════════════════════════
     Clock: contact timers + scheduled incoming chat
     ════════════════════════════════════════════════════════════════ */
  let elapsed = 0;
  const INCOMING_AFTER = 25; /* seconds until Sam's chat is offered */

  setInterval(() => {
    elapsed++;
    order.forEach(id => {
      const c = contacts[id];
      if (c.status === 'connected' || c.status === 'incoming') {
        c.seconds++;
        const t = $('timer-' + id);
        if (t) t.textContent = fmt(c.seconds);
      }
    });
    const active = contacts[activeId];
    if (active && active.status === 'connected') $('liveChatTimer').textContent = fmt(active.seconds);

    if (contacts.sam.status === 'pending' && elapsed >= INCOMING_AFTER && agentStatus === 'available') {
      offerIncoming('sam');
    }
  }, 1000);

  /* ════════════════════════════════════════════════════════════════
     Boot
     ════════════════════════════════════════════════════════════════ */
  contacts.jo.seconds = 74; /* Jo has been waiting a little longer */
  renderStatus();
  renderAll();
  resetIqa();
  startChat('nina');
  /* Jo's opening message lands in the background so the unread badge shows */
  setTimeout(() => startChat('jo'), 2500);
  </script>
</body>
</html>
