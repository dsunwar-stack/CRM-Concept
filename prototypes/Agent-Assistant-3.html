    /* Layout: slim top bar, agent desk rail on the left, two white panels on a soft canvas.
       Type: Geist for UI, Geist Mono for timers, counts and references. 4px spacing scale. */
    :root {
      --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

      --canvas: #f4f5f8;
      --surface: #ffffff;
      --surface-2: #f8f9fb;
      --ink: #0f1626;
      --ink-2: #384152;
      --muted: #687082;
      --faint: #9aa1af;
      --line: #e6e8ee;
      --line-strong: #d5d9e1;

      --accent: #2c5cf6;
      --accent-hover: #1f4ae0;
      --accent-soft: #edf1ff;
      --accent-line: #c9d5fe;
      --accent-ink: #1b3fb5;

      --ai: #6646e0;
      --ai-soft: #f3f0fe;

      --success: #11805a;
      --success-soft: #e6f5ee;
      --warn: #a95c08;
      --warn-soft: #fdf3e2;
      --danger: #cf3530;
      --danger-soft: #fdeceb;

      --text: var(--ink);

      --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
      --s5: 20px; --s6: 24px; --s8: 32px;
      --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
      --shadow-sm: 0 1px 2px rgba(15, 22, 38, 0.06);
      --shadow-md: 0 6px 20px rgba(15, 22, 38, 0.08);
      --ring: 0 0 0 3px rgba(44, 92, 246, 0.16);

      --desk-expanded: 296px;
      --desk-collapsed: 68px;
      --topbar-h: 56px;
      --panel-transition: 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
      --app-height: 100vh;
      color-scheme: light;
    }

    @supports (height: 100dvh) {
      :root { --app-height: 100dvh; }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--canvas);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "ss01" on;
    }

    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .ic { width: 1em; height: 1em; flex-shrink: 0; display: block; }
    .ico { display: inline-grid; place-items: center; line-height: 0; }

    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* ── Top bar ── */
    .topbar {
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: var(--s4);
      padding: 0 var(--s5);
    }

    .brand { display: flex; align-items: center; gap: var(--s3); font-weight: 600; font-size: 15px; letter-spacing: -0.01em; flex-shrink: 0; }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: var(--r-md);
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 17px;
    }

    .search-wrap {
      flex: 1;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: var(--s2);
      height: 36px;
      padding: 0 var(--s3);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      color: var(--faint);
      font-size: 16px;
    }
    .search-wrap:focus-within { border-color: var(--accent-line); box-shadow: var(--ring); background: var(--surface); }

    .search {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13px;
      color: var(--ink);
    }
    .search::placeholder { color: var(--faint); }

    .kbd {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--line-strong);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 0 5px;
      line-height: 16px;
    }

    .topbar-right { display: flex; align-items: center; gap: var(--s1); flex-shrink: 0; }

    .top-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      padding: 0 var(--s2);
      margin-right: var(--s2);
    }

    .top-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--r-md);
      background: transparent;
      border: none;
      display: grid;
      place-items: center;
      color: var(--ink-2);
      font-size: 18px;
      position: relative;
      transition: background 140ms ease;
    }
    .top-icon:hover { background: var(--canvas); }

    .top-icon .dot {
      position: absolute;
      top: 8px;
      right: 9px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warn);
      border: 2px solid var(--surface);
      display: none;
    }
    .top-icon.has-dot .dot { display: block; }

    /* ── Shell ── */
    .shell {
      --desk-width: var(--desk-expanded);
      display: grid;
      grid-template-columns: var(--desk-width) 1fr;
      transition: grid-template-columns var(--panel-transition);
      height: calc(var(--app-height) - var(--topbar-h));
    }
    .shell.collapsed { grid-template-columns: var(--desk-collapsed) 1fr; }

    /* ── Agent desk rail ── */
    .desk {
      background: var(--surface);
      border-right: 1px solid var(--line);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
    }

    .resizer {
      position: absolute;
      top: 0;
      right: 0;
      width: 8px;
      height: 100%;
      cursor: col-resize;
      z-index: 20;
    }
    .resizer::after {
      content: "";
      position: absolute;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 36px;
      border-radius: var(--r-pill);
      background: var(--line-strong);
      opacity: 0;
      transition: opacity 140ms ease;
    }
    .resizer:hover::after, .resizer.dragging::after { opacity: 1; background: var(--accent-line); }

    .desk-toolbar {
      padding: var(--s3);
      display: flex;
      align-items: center;
      gap: var(--s2);
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .toggle {
      width: 32px;
      height: 32px;
      border-radius: var(--r-md);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 16px;
      flex-shrink: 0;
      transition: transform var(--panel-transition), background 140ms ease;
    }
    .toggle:hover { background: var(--canvas); color: var(--ink); }

    .desk-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-right: auto;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 var(--s2) 0 var(--s3);
      border-radius: var(--r-pill);
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
    }
    .status-pill:hover { background: var(--surface-2); }
    .status-pill .ic { font-size: 14px; color: var(--muted); }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px var(--success-soft);
    }
    .status-pill.break .status-dot   { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
    .status-pill.offline .status-dot { background: var(--faint); box-shadow: 0 0 0 3px var(--canvas); }

    .status-menu {
      position: absolute;
      top: 52px;
      right: var(--s3);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-md);
      padding: var(--s1);
      z-index: 30;
      display: none;
      min-width: 160px;
    }
    .status-menu.open { display: block; }

    .status-option {
      display: flex;
      align-items: center;
      gap: var(--s2);
      width: 100%;
      border: none;
      background: transparent;
      padding: var(--s2) var(--s3);
      font-size: 13px;
      text-align: left;
      border-radius: var(--r-sm);
    }
    .status-option:hover { background: var(--canvas); }
    .status-swatch { width: 8px; height: 8px; border-radius: 50%; }
    .status-swatch.available { background: var(--success); }
    .status-swatch.break     { background: var(--warn); }
    .status-swatch.offline   { background: var(--faint); }

    /* ── Contact queue ── */
    .queue {
      padding: var(--s3);
      display: grid;
      gap: var(--s2);
      overflow-y: auto;
      flex: 0 0 auto;
      max-height: 248px;
    }

    .queue-empty { font-size: 13px; color: var(--muted); padding: var(--s3); text-align: center; }

    .call-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: var(--s3);
      display: flex;
      align-items: center;
      gap: var(--s3);
      position: relative;
      transition: border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }
    .call-card:hover { border-color: var(--line-strong); background: var(--surface-2); }

    .call-card.active.selected {
      border-color: var(--accent-line);
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px var(--accent-line);
    }
    .call-card.active.selected .name { color: var(--accent-ink); }

    .call-card.ended:not(.selected) { opacity: 0.6; }

    @keyframes ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(169, 92, 8, 0.28); }
      50%      { box-shadow: 0 0 0 6px rgba(169, 92, 8, 0); }
    }
    .call-card.incoming {
      border-color: #f2d29b;
      background: var(--warn-soft);
      animation: ring 1.6s infinite;
      cursor: default;
    }
    .call-card.incoming:hover { background: var(--warn-soft); }

    .incoming-actions { display: flex; gap: var(--s2); margin-top: var(--s2); }
    .incoming-actions button {
      flex: 1;
      height: 28px;
      border-radius: var(--r-sm);
      font-size: 12px;
      font-weight: 600;
    }
    .btn-accept  { border: none; background: var(--success); color: #fff; }
    .btn-accept:hover { filter: brightness(0.95); }
    .btn-decline { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); }

    .call-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--r-md);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 17px;
      background: var(--canvas);
      color: var(--muted);
    }
    .call-icon.chat-active   { background: var(--canvas); color: var(--ink-2); }
    .call-icon.chat-selected { background: var(--accent); color: #fff; }
    .call-icon.chat-incoming { background: #fbe3bc; color: var(--warn); }

    .unread-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: var(--r-pill);
      background: var(--danger);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      display: grid;
      place-items: center;
      border: 2px solid var(--surface);
    }

    .call-card-body { flex: 1; min-width: 0; }
    .name { font-weight: 600; font-size: 14px; line-height: 20px; letter-spacing: -0.005em; }
    .meta {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: var(--s2);
    }
    .meta span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* ── Live chat ── */
    .live-chat-panel {
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      background: var(--surface);
    }

    .active-strip {
      padding: var(--s3) var(--s4);
      display: grid;
      gap: 2px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .active-strip-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
    .active-strip-row strong { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    #liveChatTimer {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--ink-2);
      background: var(--canvas);
      border-radius: var(--r-sm);
      padding: 2px 8px;
    }
    .active-strip-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--success);
      font-weight: 500;
    }
    .active-strip-sub::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .active-strip.ended .active-strip-sub { color: var(--muted); }

    .live-chat-msgs {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: var(--s4);
      display: flex;
      flex-direction: column;
      gap: var(--s3);
      background: var(--surface-2);
    }

    .live-chat-empty {
      flex: 1;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: var(--s5);
    }

    .lc-bubble-row { display: flex; flex-direction: column; gap: 6px; }
    .lc-bubble-row.new { animation: ai-fade-in 0.3s ease; }
    .lc-bubble-row.incoming { align-items: flex-start; }
    .lc-bubble-row.outgoing { align-items: flex-end; }

    .lc-meta { display: flex; align-items: center; gap: 6px; }
    .lc-bubble-row.outgoing .lc-meta { flex-direction: row-reverse; }
    .lc-sender { font-size: 12px; font-weight: 600; color: var(--ink-2); }
    .lc-time { font-size: 11px; color: var(--faint); font-family: var(--font-mono); }

    .lc-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .lc-avatar.incoming { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
    .lc-avatar.outgoing { background: var(--ink); color: #fff; }

    .lc-bubble {
      font-size: 13px;
      line-height: 1.55;
      padding: 10px 14px;
      max-width: 88%;
      word-break: break-word;
    }
    .lc-bubble.from-customer {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 4px 14px 14px 14px;
      box-shadow: var(--shadow-sm);
    }
    .lc-bubble.from-agent {
      background: var(--accent);
      color: #fff;
      border-radius: 14px 4px 14px 14px;
    }

    .lc-read-receipt {
      font-size: 11px;
      color: var(--faint);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .lc-read-receipt .ic { font-size: 13px; color: var(--accent); }

    .lc-system {
      align-self: center;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-pill);
      padding: 3px 12px;
    }

    .lc-typing-bubble {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px 14px 14px 14px;
      width: fit-content;
    }
    .lc-typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: typing-dot 1s infinite ease-in-out; }
    .lc-typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .lc-typing-dot:nth-child(3) { animation-delay: 0.30s; }

    .live-chat-footer {
      border-top: 1px solid var(--line);
      padding: var(--s3);
      display: flex;
      gap: var(--s2);
      align-items: center;
      flex-shrink: 0;
    }
    .live-chat-footer input {
      flex: 1;
      min-width: 0;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 0 var(--s3);
      font-size: 13px;
      background: var(--surface);
      outline: none;
    }
    .live-chat-footer input:focus { border-color: var(--accent-line); box-shadow: var(--ring); }
    .live-chat-footer input:disabled { background: var(--surface-2); color: var(--faint); }

    .lc-send-btn {
      border: none;
      background: var(--accent);
      color: #fff;
      border-radius: var(--r-md);
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .lc-send-btn:hover { background: var(--accent-hover); }
    .lc-send-btn:disabled { background: var(--line-strong); cursor: not-allowed; }

    .btn-end-chat {
      flex-shrink: 0;
      border: 1px solid #f5c7c4;
      background: var(--danger-soft);
      color: var(--danger);
      border-radius: var(--r-md);
      height: 36px;
      padding: 0 var(--s3);
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
    }
    .btn-end-chat:hover { background: #fbdedc; }
    .btn-end-chat.close { border-color: var(--line-strong); background: var(--surface); color: var(--ink-2); }

    /* ── Collapsed rail ── */
    .shell.collapsed .desk .status-pill,
    .shell.collapsed .desk .desk-title,
    .shell.collapsed .desk .call-card-body,
    .shell.collapsed .desk .live-chat-panel { display: none; }
    .shell.collapsed .desk-toolbar { justify-content: center; }
    .shell.collapsed .desk .call-card { padding: var(--s2); justify-content: center; }
    .shell.collapsed .toggle { transform: rotate(180deg); }
    .shell.collapsed .resizer { pointer-events: none; }

    /* ── Main ── */
    .main {
      padding: 0 var(--s6) var(--s5);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .breadcrumb {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .breadcrumb .ic { font-size: 12px; color: var(--faint); }
    .breadcrumb .here { color: var(--ink-2); font-weight: 500; }

    .panels-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s3);
      padding-bottom: var(--s4);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .wordmark { display: flex; align-items: center; gap: 10px; }
    .wordmark-mark {
      width: 34px;
      height: 34px;
      border-radius: var(--r-md);
      background: linear-gradient(135deg, #6a4ee8 0%, #2c5cf6 100%);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(76, 78, 240, 0.28);
    }
    .wordmark-text { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
    .wordmark-text span { color: var(--muted); font-weight: 500; }

    .panels-bar-right {
      font-size: 12px;
      color: var(--ink-2);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-pill);
      padding: 4px 12px;
    }
    .panels-bar-right:empty { display: none; }

    .page {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      gap: var(--s3) var(--s4);
    }

    .page-top-row { grid-column: 1 / -1; display: flex; align-items: center; }
    .page-top-right { display: none; }

    .panel {
      grid-row: 2;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    /* Segmented tabs */
    .tabs {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      background: #e9ebf0;
      border-radius: var(--r-md);
    }
    .tab-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
    }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

    /* ── Responses ── */
    .resp-panel { display: flex; flex-direction: column; height: 100%; min-height: 0; }

    .resp-search-wrap { padding: var(--s4) var(--s4) var(--s3); flex-shrink: 0; }

    .resp-search {
      display: flex;
      align-items: center;
      gap: var(--s2);
      height: 38px;
      padding: 0 var(--s3);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
      color: var(--faint);
      font-size: 16px;
    }
    .resp-search:focus-within { border-color: var(--accent-line); box-shadow: var(--ring); }
    .resp-search input { border: none; outline: none; flex: 1; min-width: 0; font-size: 13px; color: var(--ink); background: transparent; }
    .resp-search input::placeholder { color: var(--faint); }
    .resp-search-clear {
      border: none;
      background: var(--canvas);
      color: var(--muted);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: none;
      place-items: center;
      font-size: 13px;
    }
    .resp-search.has-value .resp-search-clear { display: grid; }

    .resp-filters { display: flex; gap: var(--s2); padding: 0 var(--s4) var(--s3); flex-shrink: 0; }

    .resp-filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 var(--s3);
      border: 1px solid var(--line);
      border-radius: var(--r-pill);
      background: var(--surface);
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .resp-filter-pill .ic { font-size: 14px; color: var(--muted); }
    .resp-filter-pill:hover { background: var(--surface-2); }
    .resp-filter-pill.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .resp-filter-pill.active .ic { color: #fff; }

    .resp-list { flex: 1; overflow-y: auto; min-height: 0; border-top: 1px solid var(--line); }

    .resp-empty { padding: var(--s8) var(--s4); font-size: 13px; color: var(--muted); text-align: center; }

    .resp-category-header {
      display: flex;
      align-items: center;
      padding: var(--s2) var(--s4);
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .resp-category-header .cat-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

    .resp-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s3);
      padding: var(--s3) var(--s4);
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: background 120ms ease;
    }
    .resp-item:hover { background: var(--surface-2); }
    .resp-item.open { background: var(--surface-2); }

    .resp-item-left { display: flex; align-items: center; gap: var(--s3); min-width: 0; }

    .resp-item-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--r-md);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 17px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .resp-item-icon.critical { background: var(--danger-soft);  color: var(--danger); }
    .resp-item-icon.urgent   { background: var(--warn-soft);    color: var(--warn); }
    .resp-item-icon.closed   { background: var(--success-soft); color: var(--success); }
    .resp-item-icon.card     { background: var(--danger-soft);  color: var(--danger); }
    .resp-item-icon.freeze   { background: #e8f5fb;             color: #1179a8; }

    .resp-item-text { min-width: 0; }
    .resp-item-title { font-size: 14px; font-weight: 500; color: var(--ink); line-height: 20px; }
    .resp-item-sub { font-size: 12px; color: var(--muted); line-height: 16px; margin-top: 2px; }

    .resp-item-right { display: flex; align-items: center; gap: var(--s2); color: var(--faint); font-size: 16px; }
    .resp-item-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      background: var(--canvas);
      border-radius: var(--r-sm);
      padding: 1px 6px;
      line-height: 18px;
    }
    .resp-item-chevron { display: grid; transition: transform 180ms ease; }
    .resp-item.open .resp-item-chevron { transform: rotate(90deg); }

    .resp-expand-panel { display: none; flex-direction: column; background: var(--surface); }
    .resp-expand-panel.open { display: flex; }

    .resp-expand-row {
      display: flex;
      flex-direction: column;
      gap: var(--s1);
      padding: var(--s3) var(--s4) var(--s3) 62px;
      border-bottom: 1px solid var(--line);
    }
    .resp-expand-row:hover { background: var(--surface-2); }

    .resp-expand-row-inner { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); }

    .resp-expand-text {
      color: var(--ink-2);
      font-size: 13px;
      line-height: 20px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }
    .resp-expand-text:hover { color: var(--ink); }
    .resp-expand-text.expanded { display: block; overflow: visible; -webkit-line-clamp: unset; }

    .resp-show-more {
      align-self: flex-start;
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
    }
    .resp-show-more:hover { text-decoration: underline; }

    .resp-row-actions { display: flex; align-items: center; gap: var(--s1); flex-shrink: 0; }

    .resp-use-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink-2);
      border-radius: var(--r-sm);
      font-size: 12px;
      font-weight: 500;
    }
    .resp-use-btn:hover { border-color: var(--accent-line); color: var(--accent); background: var(--accent-soft); }

    .resp-copy-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: var(--r-sm);
      display: grid;
      place-items: center;
      font-size: 15px;
      transition: opacity 150ms ease;
    }
    .resp-copy-btn:hover { background: var(--canvas); color: var(--ink); }

    .resp-footer {
      padding: var(--s3) var(--s4);
      flex-shrink: 0;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--s2);
    }

    .resp-feedback-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      padding: 0;
    }
    .resp-feedback-btn .ic { font-size: 15px; }
    .resp-feedback-btn:hover { color: var(--accent-hover); }

    .demo-label { font-size: 11px; color: var(--faint); }

    /* ── History ── */
    #panelHistory { padding: var(--s4) !important; gap: var(--s3) !important; }
    .history-card {
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
      padding: var(--s3) var(--s4);
    }
    .history-card h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--ink); font-family: var(--font-mono); font-weight: 500; }
    .history-card p  { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.55; }
    .history-tag {
      display: inline-block;
      margin-top: var(--s2);
      font-size: 11px;
      font-weight: 500;
      color: var(--accent-ink);
      background: var(--accent-soft);
      border-radius: var(--r-pill);
      padding: 2px 10px;
    }

    /* ── Assistant panel ── */
    .assistant { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    .assistant-body { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; }

    .accordion { display: flex; flex-direction: column; flex-shrink: 0; border-bottom: 1px solid var(--line); }
    .accordion-body { overflow-y: auto; max-height: 320px; }
    .accordion-body.collapsed { display: none; }
    .accordion.qa-accordion { flex: 1 0 auto; border-bottom: none; }
    .accordion.qa-accordion .accordion-body { max-height: none; }

    .accordion-header {
      width: 100%;
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: var(--s2);
      padding: 0 var(--s4);
      background: transparent;
      border: none;
      font-weight: 600;
      font-size: 14px;
      color: var(--ink);
      text-align: left;
      letter-spacing: -0.005em;
    }
    .accordion-header:hover { background: var(--surface-2); }
    .accordion-header .chevron { font-size: 16px; color: var(--muted); transition: transform 180ms ease; }
    .accordion-header[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
    .accordion-header .acc-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      font-size: 14px;
      background: var(--canvas);
      color: var(--ink-2);
    }
    .accordion-header .acc-icon.ai { background: var(--ai-soft); color: var(--ai); }

    .accordion-body-inner { padding: 0 var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s3); }

    /* Prior summary */
    .history {
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: var(--s3) var(--s4);
      display: grid;
      gap: var(--s2);
      font-size: 13px;
    }
    .history-row { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); color: var(--ink-2); }
    .history-row > span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
    .history-row + .history-row { border-top: 1px solid var(--line); padding-top: var(--s2); }

    .link-btn { border: none; background: transparent; padding: 0; color: var(--accent); font-size: 13px; text-align: left; }
    .link-btn.strong { font-weight: 500; }
    .link-btn:hover { text-decoration: underline; }

    .summary-detail { display: none; gap: var(--s2); padding: var(--s2) 0; border-top: 1px solid var(--line); }
    .summary-detail.open { display: grid; }
    .summary-detail .sd-title { font-weight: 600; color: var(--ink); font-size: 13px; }
    .summary-detail .sd-meta  { font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
    .summary-detail dt { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .summary-detail dd { margin: 2px 0 var(--s2); font-size: 13px; color: var(--ink-2); line-height: 1.55; }

    /* Suggestions */
    .sugg-placeholder { font-size: 13px; color: var(--muted); }

    .suggestion-card {
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: var(--s3) var(--s4);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: var(--s2);
    }
    .suggestion-card + .suggestion-card { margin-top: var(--s2); }
    .suggestion-card.primary { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }

    .suggestion-title-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }

    .suggestion-title-label {
      display: flex;
      align-items: center;
      gap: var(--s2);
      font-weight: 600;
      font-size: 14px;
      line-height: 20px;
      color: var(--ink);
      border: none;
      background: transparent;
      padding: 0;
      text-align: left;
      flex: 1 1 240px;
      min-width: 0;
    }
    .suggestion-title-label .ic { font-size: 16px; color: var(--muted); transition: transform 180ms ease; }
    .suggestion-card.collapsed .suggestion-title-label .ic { transform: rotate(-90deg); }
    .suggestion-card.collapsed .suggestion-body { display: none; }

    .best-tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--success);
      background: var(--success-soft);
      border-radius: var(--r-pill);
      padding: 2px 8px;
      white-space: nowrap;
    }

    .sugg-actions { display: flex; gap: var(--s1); flex-shrink: 0; }

    .copy-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      height: 28px;
      padding: 0 var(--s2);
      border-radius: var(--r-sm);
    }
    .copy-btn:hover { background: var(--accent-soft); }
    .copy-btn.subtle { color: var(--muted); }
    .copy-btn.subtle:hover { background: var(--canvas); color: var(--ink); }

    .suggestion-body { width: 100%; }
    .suggestion-text { font-size: 14px; line-height: 22px; color: var(--ink-2); margin: 0; }

    .suggestion-text-shell, .iqa-text-shell { position: relative; }
    .suggestion-text-wrap { max-height: 88px; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    .suggestion-text-shell.has-overflow .suggestion-text-wrap,
    .iqa-text-shell.has-overflow .iqa-text-wrap { overflow-y: auto; }

    .text-fade {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0) 0%, var(--surface) 100%);
      pointer-events: none;
      transition: opacity 120ms ease;
    }
    .text-fade.hidden { opacity: 0; }

    .helpful-links-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--faint);
      margin-top: var(--s3);
    }

    .link-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .link-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px dashed var(--line-strong);
      background: var(--surface-2);
      color: var(--ink-2);
      border-radius: var(--r-sm);
      padding: 3px 8px;
      font-size: 12px;
      cursor: help;
    }
    .link-chip .ic { font-size: 13px; color: var(--muted); }

    .sugg-feedback {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      width: 100%;
      font-size: 12px;
      color: var(--muted);
      padding: var(--s2);
      background: var(--surface-2);
      border-radius: var(--r-sm);
    }
    .reason-chip {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink-2);
      border-radius: var(--r-pill);
      padding: 2px 10px;
      font-size: 12px;
    }
    .reason-chip:hover { border-color: var(--accent-line); color: var(--accent); }
    .sugg-feedback-done { color: var(--success); font-weight: 600; }

    /* ── Assist Q&A ── */
    .iqa-block { display: flex; flex-direction: column; font-size: 14px; line-height: 22px; }
    .iqa-block p { color: var(--ink-2); margin: 0 0 var(--s2); }
    .iqa-block p:last-of-type { margin-bottom: 0; }

    .iqa-question {
      align-self: flex-end;
      background: var(--ink);
      color: #fff;
      border-radius: 14px 4px 14px 14px;
      padding: 8px 14px;
      font-size: 13px;
      margin-bottom: var(--s3);
      max-width: 90%;
    }

    .iqa-text-wrap { max-height: 176px; overflow-y: hidden; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

    .iqa-header { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s2); }
    .iqa-header strong { font-weight: 600; font-size: 14px; }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 22px;
      padding: 0 8px;
      border-radius: var(--r-pill);
      background: var(--ai-soft);
      color: var(--ai);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .ai-badge .ic { font-size: 12px; }

    .feedback-btns { display: flex; gap: 2px; align-items: center; order: 3; margin-left: auto; }
    .feedback-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: var(--r-sm);
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 15px;
    }
    .feedback-btn:hover { background: var(--canvas); color: var(--ink); }
    .feedback-btn.active-up   { color: var(--success); background: var(--success-soft); }
    .feedback-btn.active-down { color: var(--danger); background: var(--danger-soft); }

    .iqa-ask {
      border-top: 1px solid var(--line);
      padding: var(--s3) var(--s4) var(--s4);
      display: flex;
      flex-direction: column;
      gap: var(--s2);
      flex-shrink: 0;
      background: var(--surface);
    }

    .iqa-ask-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
    .iqa-ask-top select {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 0 var(--s2);
      background: var(--surface);
      font-size: 12px;
      color: var(--ink-2);
    }
    .new-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 30px;
      padding: 0 var(--s2);
      border: none;
      border-radius: var(--r-sm);
      background: transparent;
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
    }
    .new-btn:hover { background: var(--accent-soft); }

    .iqa-quick { display: flex; flex-wrap: wrap; gap: 6px; }
    .iqa-quick button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink-2);
      border-radius: var(--r-pill);
      padding: 4px 10px;
      font-size: 12px;
    }
    .iqa-quick button .ic { font-size: 12px; color: var(--ai); }
    .iqa-quick button:hover { border-color: var(--accent-line); color: var(--accent); background: var(--accent-soft); }

    .iqa-ask-input-row {
      display: flex;
      align-items: center;
      gap: var(--s2);
      padding: 4px 4px 4px var(--s3);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-md);
      background: var(--surface);
    }
    .iqa-ask-input-row:focus-within { border-color: var(--accent-line); box-shadow: var(--ring); }
    .iqa-ask-input-row input { flex: 1; min-width: 0; border: none; outline: none; height: 32px; font-size: 13px; background: transparent; }

    .iqa-send-btn {
      border: none;
      background: var(--accent);
      color: #fff;
      border-radius: 7px;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      font-size: 15px;
      flex-shrink: 0;
    }
    .iqa-send-btn:hover { background: var(--accent-hover); }

    .iqa-hint { font-size: 11px; color: var(--faint); margin: 0; }

    /* Clarification */
    .clarif-card {
      position: relative;
      border-radius: var(--r-md);
      background: var(--surface);
      padding: var(--s3) var(--s4);
      display: flex;
      flex-direction: column;
      gap: var(--s3);
    }
    .clarif-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--r-md);
      padding: 1px;
      background: linear-gradient(135deg, #6a4ee8 0%, #2c5cf6 55%, #9ab0fb 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .clarif-header { display: flex; align-items: center; justify-content: space-between; }
    .clarif-title { display: flex; align-items: center; gap: 6px; flex: 1; font-weight: 600; font-size: 13px; color: var(--ai); }
    .clarif-title .ic { font-size: 15px; }
    .clarif-title > span { font-family: var(--font-mono); font-weight: 400 !important; color: var(--muted) !important; font-size: 11px !important; }
    .clarif-close { border: none; background: transparent; color: var(--muted); font-size: 18px; padding: 0 4px; line-height: 1; border-radius: var(--r-sm); }
    .clarif-close:hover { background: var(--canvas); color: var(--ink); }
    .clarif-q { font-weight: 500; font-size: 13px; line-height: 20px; color: var(--ink); }
    .clarif-input-row { display: flex; gap: var(--s2); }
    .clarif-input-row input {
      flex: 1;
      min-width: 0;
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: var(--r-sm);
      padding: 0 var(--s3);
      font-size: 13px;
      outline: none;
    }
    .clarif-input-row input:focus { border-color: var(--accent-line); box-shadow: var(--ring); }
    .clarif-next-btn {
      height: 34px;
      padding: 0 var(--s4);
      border: none;
      border-radius: var(--r-sm);
      background: var(--ink);
      color: #fff;
      font-weight: 500;
      font-size: 13px;
      flex-shrink: 0;
    }
    .clarif-next-btn:hover { background: #222b3d; }

    .clarif-sources {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: none;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
      padding: 2px 0;
      align-self: flex-start;
    }
    .clarif-sources .ic { font-size: 13px; transition: transform 180ms ease; }
    .clarif-sources.open .ic { transform: rotate(180deg); }

    .sources-list { display: grid; gap: 6px; font-size: 13px; }
    .sources-list a { color: var(--accent); text-decoration: none; }
    .sources-list a:hover { text-decoration: underline; }

    .clarif-answered-row { display: flex; flex-direction: column; gap: 4px; padding: var(--s2) 0; border-bottom: 1px solid var(--line); }
    .clarif-answered-row:last-of-type { border-bottom: none; }
    .clarif-answered-q { font-size: 12px; font-weight: 500; color: var(--muted); }
    .clarif-answered-a { font-size: 13px; color: var(--ink); background: var(--surface-2); border-radius: var(--r-sm); padding: 4px 10px; }
    .clarif-done-header { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--success); }

    .view-clarif {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: none;
      border-top: 1px solid var(--line);
      background: transparent;
      color: var(--ai);
      padding: var(--s3) 0 0;
      margin-top: var(--s3);
      font-weight: 500;
      font-size: 13px;
    }
    .view-clarif-label { display: flex; align-items: center; gap: 6px; }
    .view-clarif-label .ic { font-size: 15px; }
    .view-clarif-chevron { display: grid; font-size: 15px; transition: transform 180ms ease; }
    .view-clarif.open .view-clarif-chevron { transform: rotate(180deg); }

    /* ── Motion ── */
    @keyframes typing-dot {
      0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
      40%           { opacity: 1;    transform: translateY(-3px); }
    }
    @keyframes ai-dot-pulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40%           { opacity: 1;    transform: scale(1); }
    }
    @keyframes ai-fade-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .ai-thinking { display: flex; align-items: center; gap: 5px; padding: var(--s2) 0; font-size: 12px; color: var(--ai); }
    .ai-thinking-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ai); animation: ai-dot-pulse 1.2s infinite ease-in-out; }
    .ai-thinking-dot:nth-child(2) { animation-delay: 0.2s; }
    .ai-thinking-dot:nth-child(3) { animation-delay: 0.4s; }
    .ai-updated { animation: ai-fade-in 0.4s ease; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

    /* ── Toast ── */
    .toast-stack {
      position: fixed;
      bottom: var(--s5);
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      gap: var(--s2);
      z-index: 100;
      pointer-events: none;
    }
    .toast {
      background: var(--ink);
      color: #fff;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: var(--r-md);
      box-shadow: var(--shadow-md);
      animation: ai-fade-in 0.25s ease;
      text-align: center;
    }

    /* ── Responsive ── */
    @media (max-width: 1100px) {
      .search-wrap .kbd, .top-link { display: none; }
    }

    @media (max-width: 980px) {
      .topbar-right { display: none; }
      .main { padding: 0 var(--s4) var(--s4); overflow: auto; }
      .page { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; flex: none; }
      .panel { grid-row: auto; min-height: 520px; }
    }

    @media (max-width: 700px) {
      .shell { grid-template-columns: var(--desk-collapsed) 1fr; }
      .shell .status-pill,
      .shell .desk .desk-title,
      .shell .desk .call-card-body,
      .shell .desk .live-chat-panel { display: none; }
      .shell .desk-toolbar { justify-content: center; }
      .shell .desk .call-card { padding: var(--s2); justify-content: center; }
      .search-wrap { max-width: none; }
    }

    /* ════════ Version 3: tabbed assist panel ════════ */
    .assist-panel { display: flex; flex-direction: column; }

    .assist-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s3);
      padding: var(--s3) var(--s4);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .assist-tabs .tab-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; }
    .assist-tabs .tab-btn .ic { font-size: 14px; }
    .tab-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ai);
      box-shadow: 0 0 0 3px var(--ai-soft);
    }
    .assist-hint { font-size: 12px; color: var(--faint); }

    .assist-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #viewSuggest { overflow-y: auto; padding: var(--s4); gap: var(--s5); }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .section-label .ic { font-size: 13px; }

    /* Customer summary strip */
    .cust-strip {
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface-2);
      padding: var(--s3) var(--s4);
      display: grid;
      gap: var(--s2);
    }
    .cust-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
    .cust-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px var(--s3); font-size: 13px; }
    .cust-line strong { font-weight: 600; color: var(--ink); }
    .cust-line .mono { font-size: 12px; color: var(--muted); }
    .cust-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .case-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--r-pill);
      padding: 2px 10px;
      font-size: 12px;
      color: var(--ink-2);
    }
    .case-chip .mono { font-size: 11px; color: var(--faint); }
    .case-chip:hover { border-color: var(--accent-line); color: var(--accent); }
    .cust-strip .summary-detail { border-top: 1px solid var(--line); padding-top: var(--s3); }

    /* Next best response */
    .nbr { display: flex; flex-direction: column; gap: var(--s3); }
    .nbr-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
    .nbr-updated { font-size: 11px; color: var(--faint); }
    .nbr-empty {
      border: 1px dashed var(--line-strong);
      border-radius: var(--r-md);
      padding: var(--s5);
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .nbr .suggestion-text-wrap { max-height: 132px; }
    .nbr .suggestion-title-row { flex-wrap: nowrap; align-items: flex-start; }
    .nbr .suggestion-title-label { flex: 1 1 auto; }
    .alt-tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--ink-2);
      background: var(--canvas);
      border-radius: var(--r-pill);
      padding: 2px 8px;
      white-space: nowrap;
    }
    .suggestion-card.collapsed .collapsible { display: none; }

    .nbr-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 14px;
      border: none;
      border-radius: var(--r-sm);
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary .ic { font-size: 15px; }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      min-width: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--r-sm);
      color: var(--ink-2);
      font-size: 13px;
    }
    .icon-btn .ic { font-size: 15px; }
    .icon-btn:hover { background: var(--canvas); color: var(--ink); }
    .icon-btn.push-right { margin-left: auto; color: var(--muted); }

    .nbr-others { display: grid; gap: var(--s2); }
    .others-label { font-size: 12px; font-weight: 500; color: var(--muted); }
    .option-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .option-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      border-radius: var(--r-pill);
      padding: 5px 12px;
      font-size: 12px;
      color: var(--ink-2);
      text-align: left;
    }
    .option-chip .ic { font-size: 13px; color: var(--ai); }
    .option-chip:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-ink); }

    /* Ask Assist thread */
    .ask-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s2);
      padding: var(--s2) var(--s4);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .ask-thread {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: var(--s4);
      display: flex;
      flex-direction: column;
      gap: var(--s3);
      background: var(--surface-2);
    }
    .ask-empty {
      margin: auto;
      display: grid;
      justify-items: center;
      gap: 6px;
      max-width: 300px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .ask-empty .ic { font-size: 22px; color: var(--ai); }
    .ask-empty strong { font-size: 15px; color: var(--ink); font-weight: 600; }

    .ask-q {
      align-self: flex-end;
      max-width: 85%;
      background: var(--ink);
      color: #fff;
      border-radius: 14px 4px 14px 14px;
      padding: 8px 14px;
      font-size: 13px;
      animation: ai-fade-in 0.3s ease;
    }
    .ask-a {
      align-self: stretch;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px 14px 14px 14px;
      box-shadow: var(--shadow-sm);
      padding: var(--s3) var(--s4);
      display: flex;
      flex-direction: column;
      gap: var(--s3);
      animation: ai-fade-in 0.3s ease;
    }
    .ask-a .ai-thinking { padding: 0; }
    .ask-answer-head { display: flex; align-items: center; gap: var(--s2); }
    .ask-who { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 13px; color: var(--ai); }
    .ask-who .ic { font-size: 14px; }
    .refined-tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--success);
      background: var(--success-soft);
      border-radius: var(--r-pill);
      padding: 2px 8px;
    }
    .ask-answer-text { margin: 0; font-size: 14px; line-height: 22px; color: var(--ink-2); }

    .ask-a .clarif-card { background: var(--surface); }
    .clarif-done-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: none;
      background: transparent;
      padding: 0;
      color: var(--success);
      font-size: 13px;
      font-weight: 600;
    }
    .clarif-done-toggle > span { display: inline-flex; align-items: center; gap: 6px; }
    .clarif-done-toggle .chev { display: grid; color: var(--muted); transition: transform 180ms ease; }
    .clarif-done-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
    .clarif-reopen { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; }
    .clarif-reopen .ic { font-size: 14px; }

    .ask-composer {
      border-top: 1px solid var(--line);
      padding: var(--s3) var(--s4) var(--s4);
      display: flex;
      flex-direction: column;
      gap: var(--s2);
      background: var(--surface);
      flex-shrink: 0;
    }

    /* Suggestion bar above the chat message box */
    .composer-sugg {
      padding: var(--s2) var(--s3) 0;
      border-top: 1px solid var(--line);
      background: var(--surface);
      flex-shrink: 0;
    }
    .composer-sugg:not([hidden]) + .live-chat-footer { border-top: none; }
    .csg-box {
      display: flex;
      align-items: center;
      gap: var(--s2);
      padding: 6px 6px 6px 10px;
      border: 1px solid #ddd4fb;
      background: var(--ai-soft);
      border-radius: var(--r-md);
      font-size: 12px;
      animation: ai-fade-in 0.3s ease;
    }
    .csg-ic { display: grid; color: var(--ai); font-size: 14px; }
    .csg-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
    .csg-label { color: var(--ai); font-weight: 600; margin-right: 6px; }
    .csg-use {
      border: none;
      background: var(--ai);
      color: #fff;
      border-radius: var(--r-sm);
      height: 26px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .csg-use:hover { filter: brightness(0.94); }
    .csg-close {
      border: none;
      background: transparent;
      color: var(--muted);
      width: 26px;
      height: 26px;
      border-radius: var(--r-sm);
      display: grid;
      place-items: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .csg-close:hover { background: rgba(102, 70, 224, 0.1); color: var(--ink); }

    .ask-toolbar select {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 0 var(--s2);
      background: var(--surface);
      font-size: 12px;
      color: var(--ink-2);
    }
    .clarif-card.done { padding: var(--s2) var(--s3); }
    .clarif-card.done::before { background: var(--line); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"><span class="ico" data-icon="headset"></span></div>
      <div>Agent Desk</div>
    </div>
    <label class="search-wrap">
      <span class="ico" data-icon="search"></span>
      <input class="search" type="text" id="globalSearch" placeholder="Search customers, cases, guides" aria-label="Search" />
      <span class="kbd">⌘K</span>
    </label>
    <div class="topbar-right" aria-label="Top bar actions">
      <span class="top-link">Knowledge base <span class="ico" data-icon="external-link"></span></span>
      <button class="top-icon" id="notifBtn" type="button" title="Notifications" aria-label="Notifications">
        <span class="ico" data-icon="bell"></span>
        <span class="dot"></span>
      </button>
      <button class="top-icon" type="button" title="Settings" aria-label="Settings" onclick="toast('Settings aren\'t part of this prototype')">
        <span class="ico" data-icon="settings"></span>
      </button>
      <button class="top-icon" type="button" title="Profile" aria-label="Profile" onclick="toast('Signed in as Alex Morgan · Chat team')">
        <span class="ico" data-icon="circle-user-round"></span>
      </button>
    </div>
  </header>

  <div class="shell" id="shell">
    <!-- ── Agent Desk rail ── -->
    <aside class="desk" aria-label="Agent Desk panel">
      <div class="resizer" id="deskResizer" aria-hidden="true"></div>

      <div class="desk-toolbar">
        <button class="toggle" id="toggleBtn" aria-expanded="true" aria-controls="deskQueue" title="Expand or collapse the Agent Desk panel"><span class="ico" data-icon="chevrons-left"></span></button>
        <span class="desk-title">Chats</span>
        <button class="status-pill" id="statusPill" type="button" aria-haspopup="true" aria-expanded="false"></button>
        <div class="status-menu" id="statusMenu" role="menu">
          <button class="status-option" type="button" data-status="available"><span class="status-swatch available"></span>Available</button>
          <button class="status-option" type="button" data-status="break"><span class="status-swatch break"></span>Break</button>
          <button class="status-option" type="button" data-status="offline"><span class="status-swatch offline"></span>Offline</button>
        </div>
      </div>

      <div class="queue" id="deskQueue"></div>

      <div class="live-chat-panel" id="liveChatPanel">
        <div class="active-strip" id="activeStrip">
          <div class="active-strip-row">
            <strong id="activeStripName"></strong>
            <span id="liveChatTimer">00:00</span>
          </div>
          <div class="active-strip-sub" id="activeStripSub">Connected Chat</div>
        </div>

        <div class="live-chat-msgs" id="liveChatMsgs"></div>

        <div class="composer-sugg" id="composerSugg" hidden></div>

        <div class="live-chat-footer">
          <input type="text" id="liveChatInput" placeholder="Type a message…" aria-label="Type a message" />
          <button class="lc-send-btn" id="lcSendBtn" type="button" aria-label="Send"><span class="ico" data-icon="send-horizontal"></span></button>
          <button class="btn-end-chat" id="endChatBtn" type="button">End Chat</button>
        </div>
      </div>
    </aside>

    <!-- ── Main content ── -->
    <main class="main">
      <div class="breadcrumb">Agent Desk <span class="ico" data-icon="chevron-right"></span> <span class="here">Live chats</span></div>
      <div class="panels-bar">
        <div class="panels-bar-left">
          <div class="wordmark">
            <span class="wordmark-mark"><span class="ico" data-icon="sparkles"></span></span>
            <span class="wordmark-text">Agent <span>Assist</span></span>
          </div>
        </div>
        <div class="panels-bar-right" id="contextLabel"></div>
      </div>

      <section class="page">
        <div class="page-top-row">
          <div class="page-top-left">
            <div class="tabs" role="tablist" aria-label="Chat view tabs">
              <button class="tab-btn active" id="tabResponses" role="tab" aria-selected="true" aria-controls="panelResponses" type="button">Responses</button>
              <button class="tab-btn" id="tabHistory" role="tab" aria-selected="false" aria-controls="panelHistory" type="button">History</button>
            </div>
          </div>
          <div class="page-top-right"></div>
        </div>

        <!-- Left panel -->
        <article class="panel">
          <div id="panelResponses" role="tabpanel" aria-labelledby="tabResponses" style="display:flex; flex-direction:column; height:100%; min-height:0;">
            <div class="resp-panel">
              <div class="resp-search-wrap">
                <div class="resp-search" id="respSearchBox">
                  <span class="ico" data-icon="search"></span>
                  <input type="text" id="respSearch" placeholder="Search responses" aria-label="Search responses">
                  <button class="resp-search-clear" id="respSearchClear" type="button" aria-label="Clear search"><span class="ico" data-icon="x"></span></button>
                </div>
              </div>

              <div class="resp-filters" id="respFilters">
                <button class="resp-filter-pill active" type="button" data-filter="all">All</button>
                <button class="resp-filter-pill" type="button" data-filter="card"><span class="ico" data-icon="credit-card"></span>Card</button>
                <button class="resp-filter-pill" type="button" data-filter="retail"><span class="ico" data-icon="store"></span>Retail</button>
              </div>

              <div class="resp-list" id="respList"></div>

              <div class="resp-footer">
                <button class="resp-feedback-btn" type="button" onclick="toast('Thanks — the feedback form would open here')">
                  <span class="ico" data-icon="message-square-heart"></span>
                  Give Feedback
                </button>
                <span class="demo-label">Concept prototype · scripted responses · invented data</span>
              </div>
            </div>
          </div>

          <div id="panelHistory" role="tabpanel" aria-labelledby="tabHistory" style="display:none; flex-direction:column; height:100%; padding:14px; overflow-y:auto; gap:10px;"></div>
        </article>

        <!-- Right panel: Assist, split into Suggestions and Ask Assist -->
        <article class="panel assist-panel">
          <div class="assist-head">
            <div class="tabs assist-tabs" role="tablist" aria-label="Assist views">
              <button class="tab-btn active" id="tabSuggest" role="tab" aria-selected="true" aria-controls="viewSuggest" type="button">
                <span class="ico" data-icon="sparkles"></span>Suggestions<span class="tab-dot" id="suggestDot" hidden></span>
              </button>
              <button class="tab-btn" id="tabAsk" role="tab" aria-selected="false" aria-controls="viewAsk" type="button">
                <span class="ico" data-icon="circle-help"></span>Ask Assist
              </button>
            </div>
            <span class="assist-hint">Updates as the chat moves</span>
          </div>

          <div class="assist-view" id="viewSuggest" role="tabpanel" aria-labelledby="tabSuggest">
            <div class="cust-strip" id="priorSummary"></div>
            <div class="nbr" id="suggestionCard"></div>
          </div>

          <div class="assist-view" id="viewAsk" role="tabpanel" aria-labelledby="tabAsk" hidden>
            <div class="ask-toolbar">
              <select aria-label="Category" id="iqaCategory">
                <option>Card</option>
                <option>Payments</option>
                <option>Disputes</option>
              </select>
              <button class="new-btn" type="button" id="iqaNewBtn"><span class="ico" data-icon="plus"></span>New conversation</button>
            </div>
            <div class="ask-thread" id="askThread" aria-live="polite"></div>
            <div class="ask-composer">
              <div class="iqa-quick" id="iqaQuick"></div>
              <div class="iqa-ask-input-row">
                <input type="text" id="iqaInput" placeholder="Ask Assist a question" aria-label="Ask Assist a question" />
                <button class="iqa-send-btn" type="button" aria-label="Send" id="iqaSendBtn"><span class="ico" data-icon="send-horizontal"></span></button>
              </div>
              <p class="iqa-hint">Full sentences work best. Answers are AI Generated and should be verified.</p>
            </div>
          </div>
        </article>
      </section>
    </main>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script>
  /* ════════════════════════════════════════════════════════════════
     Helpers
     ════════════════════════════════════════════════════════════════ */
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const fmt = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  const nowTime = () => new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    $('toastStack').appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
    }
    fallbackCopy(text);
    return Promise.resolve();
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* ignore */ }
    ta.remove();
  }

  function thinkingHTML() {
    return '<div class="ai-thinking"><div class="ai-thinking-dot"></div><div class="ai-thinking-dot"></div><div class="ai-thinking-dot"></div>&nbsp;Assist is thinking…</div>';
  }

  /* ════════════════════════════════════════════════════════════════
     Scheduling per contact (so timers stop if the chat ends)
     ════════════════════════════════════════════════════════════════ */
  function schedule(id, ms, fn) {
    const c = contacts[id];
    const t = setTimeout(() => {
      c.timeouts = c.timeouts.filter(x => x !== t);
      fn();
    }, ms);
    c.timeouts.push(t);
  }

  /* ════════════════════════════════════════════════════════════════
     Agent Desk queue
     ════════════════════════════════════════════════════════════════ */
  function renderQueue() {
    const q = $('deskQueue');
    if (!order.length) {
      q.innerHTML = '<div class="queue-empty">No active contacts</div>';
      return;
    }
    q.innerHTML = order.map(id => {
      const c = contacts[id];
      const selected = id === activeId && c.status !== 'incoming';
      const cls = ['call-card'];
      if (c.status === 'connected' || c.status === 'ended') cls.push('active');
      if (c.status === 'incoming') cls.push('incoming');
      if (c.status === 'ended') cls.push('ended');
      if (selected) cls.push('selected');
      const iconCls = c.status === 'incoming' ? 'chat-incoming' : selected ? 'chat-selected' : 'chat-active';
      const label = c.status === 'incoming' ? 'Incoming Chat' : c.status === 'ended' ? 'Chat ended' : 'Connected Chat';
      const badge = (!selected && c.unread) ? `<span class="unread-badge">${c.unread}</span>` : '';
      const actions = c.status === 'incoming'
        ? `<div class="incoming-actions"><button class="btn-accept" type="button" data-accept="${id}">Accept</button><button class="btn-decline" type="button" data-decline="${id}">Decline</button></div>`
        : '';
      return `<article class="${cls.join(' ')}" data-contact="${id}">
        <span class="call-icon ${iconCls}" aria-hidden="true">${icon(c.status === 'incoming' ? 'message-square-dot' : 'message-square')}</span>
        <div class="call-card-body">
          <div class="name">${esc(c.name)}</div>
          <div class="meta"><span>${label}</span><span id="timer-${id}">${fmt(c.seconds)}</span></div>
          ${actions}
        </div>
        ${badge}
      </article>`;
    }).join('');
  }

  $('deskQueue').addEventListener('click', (e) => {
    const accept = e.target.closest('[data-accept]');
    if (accept) { acceptContact(accept.dataset.accept); return; }
    const decline = e.target.closest('[data-decline]');
    if (decline) { declineContact(decline.dataset.decline); return; }
    const card = e.target.closest('.call-card');
    if (!card) return;
    const c = contacts[card.dataset.contact];
    if (c.status === 'incoming') {
      if (shell.classList.contains('collapsed')) toggleBtn.click();
      return;
    }
    selectContact(c.id);
  });

  function offerIncoming(id) {
    const c = contacts[id];
    c.status = 'incoming';
    c.seconds = 0;
    order.push(id);
    renderQueue();
    $('notifBtn').classList.add('has-dot');
    toast(`Incoming chat from ${c.name}`);
  }

  function acceptContact(id) {
    const c = contacts[id];
    c.status = 'connected';
    c.seconds = 0;
    $('notifBtn').classList.remove('has-dot');
    selectContact(id);
  }

  function declineContact(id) {
    order = order.filter(x => x !== id);
    contacts[id].status = 'declined';
    $('notifBtn').classList.remove('has-dot');
    renderQueue();
    toast(`Declined chat from ${contacts[id].name}`);
  }

  function selectContact(id) {
    const c = contacts[id];
    const prev = contacts[activeId];
    if (prev) prev.draft = $('liveChatInput').value;
    $('liveChatInput').value = c.draft;
    activeId = id;
    c.unread = 0;
    renderAll();
    resetIqa();
    if (!c.started) startChat(id);
  }

  function renderAll() {
    renderQueue();
    renderLiveChat();
    renderPriorSummary();
    renderSuggestions();
    renderHistory();
    renderResponses();
    renderIqaQuick();
    const c = contacts[activeId];
    $('contextLabel').textContent = c ? `Assisting: ${c.name}` : '';
  }

  /* ════════════════════════════════════════════════════════════════
     Live chat
     ════════════════════════════════════════════════════════════════ */
  function messageHTML(c, m, isNew) {
    if (m.role === 'system') return `<div class="lc-system">${esc(m.text)}</div>`;
    const isCustomer = m.role === 'customer';
    const dir = isCustomer ? 'incoming' : 'outgoing';
    const initials = isCustomer ? c.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase() : AGENT.initials;
    const sender = isCustomer ? c.first : `${AGENT.name} (you)`;
    const receipt = isCustomer ? '' : `<div class="lc-read-receipt">${icon('check-check')} Read</div>`;
    return `<div class="lc-bubble-row ${dir}${isNew ? ' new' : ''}">
      <div class="lc-meta"><div class="lc-avatar ${dir}">${initials}</div><span class="lc-sender">${esc(sender)}</span><span class="lc-time">${m.time}</span></div>
      <div class="lc-bubble ${isCustomer ? 'from-customer' : 'from-agent'}">${esc(m.text)}</div>${receipt}
    </div>`;
  }

  function renderLiveChat() {
    renderComposerSuggestion();
    const c = contacts[activeId];
    const msgs = $('liveChatMsgs');
    const input = $('liveChatInput');
    const endBtn = $('endChatBtn');
    const strip = $('activeStrip');

    if (!c) {
      $('activeStripName').textContent = 'No contact selected';
      $('activeStripSub').textContent = 'Waiting for chats';
      $('liveChatTimer').textContent = '';
      strip.classList.add('ended');
      msgs.innerHTML = `<div class="live-chat-empty">${agentStatus === 'available' ? 'You\'re available. New chats will appear above.' : 'Set your status to Available to receive chats.'}</div>`;
      input.disabled = true;
      $('lcSendBtn').disabled = true;
      endBtn.style.display = 'none';
      return;
    }

    const ended = c.status === 'ended';
    $('activeStripName').textContent = c.name;
    $('activeStripSub').textContent = ended ? 'Chat ended · After contact work' : 'Connected Chat';
    $('liveChatTimer').textContent = fmt(c.seconds);
    strip.classList.toggle('ended', ended);

    let html = c.messages.map((m, i) => messageHTML(c, m, i >= c.rendered)).join('');
    c.rendered = c.messages.length;
    if (c.typing) {
      html += `<div class="lc-bubble-row incoming"><div class="lc-meta"><span class="lc-sender">${esc(c.first)} is typing</span></div>
        <div class="lc-typing-bubble"><div class="lc-typing-dot"></div><div class="lc-typing-dot"></div><div class="lc-typing-dot"></div></div></div>`;
    }
    msgs.innerHTML = html;
    msgs.scrollTop = msgs.scrollHeight;

    input.disabled = ended;
    $('lcSendBtn').disabled = ended;
    input.placeholder = ended ? 'This chat has ended' : 'Type a message…';
    endBtn.style.display = '';
    endBtn.textContent = ended ? 'Close Contact' : 'End Chat';
    endBtn.classList.toggle('close', ended);
  }

  function addMessage(id, msg) {
    const c = contacts[id];
    c.messages.push({ ...msg, time: nowTime() });
    if (id === activeId) {
      renderLiveChat();
    } else if (msg.role === 'customer') {
      c.unread++;
      renderQueue();
    }
    if (msg.role === 'customer') updateAi(id);
  }

  function startChat(id) {
    const c = contacts[id];
    c.started = true;
    const text = openingMessages[id];
    c.typing = true;
    if (id === activeId) renderLiveChat();
    schedule(id, 1200 + Math.min(text.length * 12, 1400), () => {
      c.typing = false;
      addMessage(id, { role: 'customer', text });
    });
  }

  function pickCustomerReply(id, agentText) {
    const c = contacts[id];
    const stages = customerReplies[id];
    if (!stages || c.replyStage >= stages.length) return null;
    for (let i = c.replyStage; i < stages.length; i++) {
      if (stages[i].match.test(agentText)) {
        c.replyStage = i + 1;
        return stages[i].text;
      }
    }
    const text = stages[c.replyStage].text;
    c.replyStage++;
    return text;
  }

  function triggerCustomerReply(id, agentText) {
    const c = contacts[id];
    const reply = pickCustomerReply(id, agentText);
    if (!reply) return;
    schedule(id, 700, () => {
      c.typing = true;
      if (id === activeId) renderLiveChat();
    });
    schedule(id, 700 + 900 + Math.min(reply.length * 15, 1500), () => {
      c.typing = false;
      addMessage(id, { role: 'customer', text: reply });
    });
  }

  function sendLiveMessage() {
    const input = $('liveChatInput');
    const text = input.value.trim();
    const c = contacts[activeId];
    if (!text || !c || c.status !== 'connected') return;
    input.value = '';
    addMessage(c.id, { role: 'agent', text });
    triggerCustomerReply(c.id, text);
  }

  function insertIntoChat(text) {
    const c = contacts[activeId];
    if (!c || c.status !== 'connected') { toast('Select a connected chat first'); return; }
    const input = $('liveChatInput');
    input.value = text;
    input.focus();
    input.setSelectionRange(text.length, text.length);
    if (shell.classList.contains('collapsed')) toggleBtn.click();
    toast('Added to the chat box — press Enter to send');
  }

  $('lcSendBtn').addEventListener('click', sendLiveMessage);
  $('liveChatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendLiveMessage(); }
  });

  $('endChatBtn').addEventListener('click', () => {
    const c = contacts[activeId];
    if (!c) return;
    if (c.status === 'connected') {
      c.timeouts.forEach(clearTimeout);
      c.timeouts = [];
      c.typing = false;
      c.status = 'ended';
      c.messages.push({ role: 'system', text: `Chat ended by ${AGENT.name} · ${nowTime()}`, time: nowTime() });
      renderQueue();
      renderLiveChat();
      toast(`Chat with ${c.name} ended`);
    } else {
      order = order.filter(x => x !== c.id);
      const next = order.find(x => contacts[x].status === 'connected') || order.find(x => contacts[x].status === 'ended') || null;
      activeId = next;
      $('liveChatInput').value = next ? contacts[next].draft : '';
      if (next) contacts[next].unread = 0;
      renderAll();
      resetIqa();
      toast(`Contact with ${c.name} closed`);
    }
  });
